  function store(k, v) {
    try {
      if (v === undefined) return localStorage.getItem('bg.' + k);
      localStorage.setItem('bg.' + k, v);
    } catch (e) { return null; }
  }
  function num(k) { return parseInt(store(k) || '0', 10); }

  function dayNo() { return Math.floor(new Date().setHours(0, 0, 0, 0) / 86400000); }

  /* ---------- 腦力點 ---------- */
  function coins() { return num('coins'); }
  function addCoins(n) { store('coins', coins() + n); }
  function spend(n) { if (coins() < n) return false; store('coins', coins() - n); return true; }

  /* ---------- 商店 ---------- */
  var SHOP = [
    { id: 'hint', name: '提示券', price: 30, kind: 'item',
      desc: '猜數字用：一次幫你劃掉兩個不在答案裡的數字' },
    { id: 'n5', name: '解鎖　5 位數', price: 150, kind: 'unlock',
      desc: '猜數字的進階難度，多一位就難很多' },
    { id: 'r4', name: '解鎖　數字可重複', price: 400, kind: 'unlock',
      desc: '猜數字最硬的玩法，答案可能出現兩個一樣的數字' }
  ];

  function owns(id) { return store('own.' + id) === '1'; }
  function items(id) { return num('item.' + id); }
  function useItem(id) { var n = items(id); if (n <= 0) return false; store('item.' + id, n - 1); return true; }

  /* ---------- 每日挑戰 ----------
     事件由遊戲回報：finish(結束一局) / win(猜中)
     完成就自動入袋，不用再按一次領取 */
  var CHALLENGES = [
    { id: 'play3',  text: '玩滿 3 局',            goal: 3, coin: 10, hit: function (e) { return e.type === 'finish'; } },
    { id: 'win2',   text: '完成 2 局',            goal: 2, coin: 12, hit: function (e) { return e.type === 'win'; } },
    { id: 'win5',   text: '一天完成 5 局',        goal: 5, coin: 20, hit: function (e) { return e.type === 'win'; } },
    { id: 'sud1',   text: '解完一題數獨',          goal: 1, coin: 14, hit: function (e) { return e.type === 'win' && e.game === 'sudoku'; } },
    { id: 'sudNo',  text: '數獨全程不填錯',        goal: 1, coin: 18, hit: function (e) { return e.type === 'win' && e.game === 'sudoku' && e.mistakes === 0; } },
    { id: 'gue1',   text: '猜中一局猜數字',        goal: 1, coin: 14, hit: function (e) { return e.type === 'win' && e.game === 'guess'; } },
    { id: 'gom1',   text: '五子棋贏電腦一局',      goal: 1, coin: 16, hit: function (e) { return e.type === 'win' && e.game === 'gomoku'; } },
    { id: 'gomTry', text: '下一局五子棋',          goal: 1, coin: 10, hit: function (e) { return e.type === 'finish' && e.game === 'gomoku'; } },
    { id: 'quick',  text: '8 次以內猜中一局',      goal: 1, coin: 15, hit: function (e) { return e.type === 'win' && e.game === 'guess' && e.guesses <= 8; } },
    { id: 'try4',   text: '挑戰一局 4 位數以上',   goal: 1, coin: 12, hit: function (e) { return e.type === 'finish' && e.game === 'guess' && e.len >= 4; } }
  ];

  /* 每天固定挑三個，同一天永遠一樣，不會因為重開而換掉 */
  function todayChallenges() {
    var d = dayNo(), out = [];
    for (var i = 0; i < 3; i++) out.push(CHALLENGES[(d * 3 + i) % CHALLENGES.length]);
    return out;
  }

  function progressKey() { return 'ch.' + dayNo(); }
  function progress() {
    try { return JSON.parse(store(progressKey()) || '{}'); } catch (e) { return {}; }
  }
  function saveProgress(p) { store(progressKey(), JSON.stringify(p)); }

  /* 遊戲呼叫這個回報一局的結果 */
  function report(e) {
    var list = todayChallenges(), p = progress(), earned = 0, done = [];
    for (var i = 0; i < list.length; i++) {
      var c = list[i], cur = p[c.id] || 0;
      if (cur >= c.goal) continue;
      if (c.hit(e)) {
        cur++;
        p[c.id] = cur;
        if (cur >= c.goal) { earned += c.coin; done.push(c.text); }
      }
    }
    saveProgress(p);
    if (earned) addCoins(earned);
    return { earned: earned, done: done };
  }

  /* ---------- 底部面板 ---------- */
  var sheetClick = null, sheetDismiss = null;

  function openSheet(html, onClick, onDismiss) {
    sheetEl.innerHTML = html;
    sheetClick = onClick || null;
    sheetDismiss = onDismiss || null;
    veil.classList.add('on');
  }

  function closeSheet() {
    var wasOpen = veil.classList.contains('on');
    veil.classList.remove('on');
    sheetClick = null;
    var d = sheetDismiss;
    sheetDismiss = null;
    /* 等淡出結束再清掉內容，不然關掉的面板還留在畫面結構裡（螢幕閱讀器會讀到） */
    if (wasOpen) setTimeout(function () {
      if (!veil.classList.contains('on')) sheetEl.innerHTML = '';
    }, 220);
    if (wasOpen && d) d();
  }

  /* ---------- 字體大小 ---------- */
  function applyFontSize() {
    document.documentElement.setAttribute('data-fs', store('fs') === '2' ? '2' : '1');
  }

  /* ---------- 文案小工具 ---------- */
  function greet() {
    var h = new Date().getHours();
    if (h < 5) return '夜深了';
    if (h < 11) return '早安';
    if (h < 18) return '午安';
    return '晚安';
  }
  function dateLine() {
    var d = new Date();
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 · 星期' + ['日','一','二','三','四','五','六'][d.getDay()];
  }

  /* ---------- 大廳 ---------- */
  function lobby() {
    var h = '<div class="lobby">' +
      '<div class="lobtop">' +
        '<div>' +
          '<div class="date">' + dateLine() + '</div>' +
          '<div class="hi">' + greet() + '</div>' +
        '</div>' +
        '<button class="purse" data-shop="1" aria-label="打開商店">' +
          '<span class="coin"></span><b>' + coins() + '</b><span class="shoplb">商店</span>' +
        '</button>' +
      '</div>' +
      '<div class="eyebrow">選一個來玩</div>' +
      '<div class="cards">';

    for (var i = 0; i < games.length; i++) {
      var g = games[i];
      var sc = g.ready && g.score ? g.score() : '';
      h += '<button class="card' + (g.ready ? '' : ' soon') + '" data-go="' + g.id + '"' + (g.ready ? '' : ' disabled') + '>' +
             '<span class="mark">' + g.mark + '</span>' +
             '<span class="txt">' +
               '<span class="nm">' + g.name + '</span>' +
               '<span class="tg">' + g.tagline + '</span>' +
               (sc ? '<span class="sc">' + sc + '</span>' : '') +
             '</span>' +
             (g.ready ? '<span class="go"></span>' : '<span class="badge">準備中</span>') +
           '</button>';
    }
    h += '</div>';

    /* 今天的挑戰 */
    var list = todayChallenges(), p = progress(), doneN = 0;
    for (var j = 0; j < list.length; j++) if ((p[list[j].id] || 0) >= list[j].goal) doneN++;

    h += '<div class="eyebrow spaced">今天的挑戰　<span class="cnt">' + doneN + ' / ' + list.length + '</span></div>' +
         '<div class="quests">';
    for (var k = 0; k < list.length; k++) {
      var c = list[k], cur = Math.min(p[c.id] || 0, c.goal), ok = cur >= c.goal;
      h += '<div class="quest' + (ok ? ' ok' : '') + '">' +
             '<span class="tick"></span>' +
             '<span class="qt">' + c.text + (c.goal > 1 ? ' <i>' + cur + '/' + c.goal + '</i>' : '') + '</span>' +
             '<span class="qc"><span class="coin"></span>' + c.coin + '</span>' +
           '</div>';
    }
    h += '</div>';

    h += '<div class="prefs"><span class="lb">字體大小</span>' +
           '<span class="seg">' +
             '<button data-setfs="1" class="' + (store('fs') === '2' ? '' : 'on') + '">標準</button>' +
             '<button data-setfs="2" class="' + (store('fs') === '2' ? 'on' : '') + '">大</button>' +
           '</span>' +
         '</div>' +
       '</div>';

    appEl.innerHTML = h;
  }

  /* ---------- 商店 ---------- */
  function shop(msg) {
    var h = '<h2>商店<small>玩遊戲賺腦力點，這裡花掉</small></h2>' +
            '<div class="purse-big"><span class="coin"></span><b>' + coins() + '</b> 腦力點</div>' +
            (msg ? '<div class="shopmsg">' + msg + '</div>' : '') +
            '<div class="opts">';
    for (var i = 0; i < SHOP.length; i++) {
      var s = SHOP[i];
      var got = s.kind === 'unlock' ? owns(s.id) : false;
      var have = s.kind === 'item' ? items(s.id) : 0;
      var afford = coins() >= s.price;
      h += '<div class="shopitem' + (got ? ' got' : '') + '">' +
             '<div class="si-txt">' +
               '<div class="nm">' + s.name + (have ? ' <i>已有 ' + have + ' 張</i>' : '') + '</div>' +
               '<div class="tg">' + s.desc + '</div>' +
             '</div>' +
             (got
               ? '<span class="si-got">已解鎖</span>'
               : '<button class="si-buy' + (afford ? '' : ' poor') + '" data-buy="' + s.id + '">' +
                   '<span class="coin"></span>' + s.price + '</button>') +
           '</div>';
    }
    h += '</div><button class="btn-main" data-act="close">回大廳</button>';

    openSheet(h, function (b) {
      if (b.dataset.buy) { buy(b.dataset.buy); return; }
      closeSheet();
    }, lobby);
  }

  function buy(id) {
    var s = null;
    for (var i = 0; i < SHOP.length; i++) if (SHOP[i].id === id) s = SHOP[i];
    if (!s) return;
    if (s.kind === 'unlock' && owns(s.id)) return;
    if (coins() < s.price) { shop('腦力點還不夠，再玩幾局就有了'); return; }
    spend(s.price);
    if (s.kind === 'unlock') { store('own.' + s.id, '1'); shop('買好了，' + s.name.replace(/解鎖　/, '') + ' 可以玩了'); }
    else { store('item.' + s.id, items(s.id) + 1); shop('買好了，遊戲裡按「提示」就能用'); }
  }

  /* ---------- 怎麼玩 ----------
     數獨大家都會，但數織、五子棋的規則不能假設長輩知道。
     第一次進遊戲自動跳出來，之後右上角問號隨時可以再看。 */
  function helpSheet(g) {
    if (!g || !g.help) return;
    openSheet(
      '<h2>怎麼玩 · ' + g.name + '</h2><div class="help">' + g.help + '</div>' +
      '<button class="btn-main" data-act="ok">知道了，開始玩</button>',
      function () { closeSheet(); }
    );
  }

  /* ---------- 路由 ---------- */
  function route() {
    if (current && current.unmount) current.unmount();
    current = null;
    closeSheet();

    var id = (location.hash || '').replace(/^#\/?/, '');
    var g = null;
    for (var i = 0; i < games.length; i++) if (games[i].id === id && games[i].ready) g = games[i];

    if (!g) { lobby(); return; }

    appEl.innerHTML =
      '<div class="game">' +
        '<div class="gamebar">' +
          '<button class="iconbtn" id="backBtn" aria-label="回到大廳">&#8592;</button>' +
          '<div class="barslot" id="barslot"></div>' +
          (g.help ? '<button class="iconbtn" id="helpBtn" aria-label="怎麼玩">?</button>' : '') +
        '</div>' +
        '<div class="gamebody" id="gamebody"></div>' +
      '</div>';

    document.getElementById('backBtn').addEventListener('click', function () { location.hash = ''; });
    if (g.help) {
      document.getElementById('helpBtn').addEventListener('click', function () { helpSheet(g); });
    }
    current = g;
    g.mount(document.getElementById('gamebody'), document.getElementById('barslot'));

    /* 第一次玩這款就自動說明一次，看過就不再擋路 */
    if (g.help && store('seen.' + g.id) !== '1') {
      store('seen.' + g.id, '1');
      helpSheet(g);
    }
  }

  /* ---------- 啟動 ---------- */
  function boot() {
    appEl = document.getElementById('app');
    veil = document.getElementById('veil');
    sheetEl = document.getElementById('sheet');

    veil.addEventListener('click', function (e) { if (e.target === veil) closeSheet(); });
    sheetEl.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (b && sheetClick) sheetClick(b);
    });

    appEl.addEventListener('click', function (e) {
      var go = e.target.closest('[data-go]');
      if (go) { location.hash = '/' + go.dataset.go; return; }
      if (e.target.closest('[data-shop]')) { shop(); return; }
      /* 注意：屬性名不能跟 <html data-fs> 撞名，否則 closest() 會一路找到 html，
         變成遊戲裡按任何東西都被當成在調字體、然後被踢回大廳 */
      var fs = e.target.closest('[data-setfs]');
      if (fs) { store('fs', fs.dataset.setfs); applyFontSize(); lobby(); }
    });

    window.addEventListener('hashchange', route);
    applyFontSize();
    route();
  }

  return {
    register: function (g) { games.push(g); },
    store: store,
    coins: coins,
    addCoins: addCoins,
    owns: owns,
    items: items,
    useItem: useItem,
    report: report,
    openSheet: openSheet,
    closeSheet: closeSheet,
    openShop: shop,
    boot: boot
  };
})();


/* === games/sudoku.js === */
/* ===========================================================
   數獨
   出題器保證唯一解；六階難度，從 6x6 入門到 9x9 地獄
   =========================================================== */
(function () {

  var DIFFS = [
    { key: 'e6', name: '入門', sub: '6 格',   n: 6, br: 2, bc: 3, givens: 20, base: 8  },
    { key: 'e9', name: '簡單', sub: '9 格',   n: 9, br: 3, bc: 3, givens: 42, base: 12 },
    { key: 'n9', name: '普通', sub: '9 格',   n: 9, br: 3, bc: 3, givens: 36, base: 18 },
    { key: 'h9', name: '進階', sub: '9 格',   n: 9, br: 3, bc: 3, givens: 32, base: 26 },
    { key: 'x9', name: '困難', sub: '9 格',   n: 9, br: 3, bc: 3, givens: 28, base: 36 },
    { key: 'z9', name: '地獄', sub: '9 格',   n: 9, br: 3, bc: 3, givens: 24, base: 50 }
  ];

  var S = null, host = null, bar = null, ticker = null;

  /* ================= 出題 ================= */

  function shuffled(n) {
    var a = [];
    for (var i = 1; i <= n; i++) a.push(i);
    for (var j = a.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }

  function boxOf(i, d) {
    var r = Math.floor(i / d.n), c = i % d.n;
    return Math.floor(r / d.br) * (d.n / d.bc) + Math.floor(c / d.bc);
  }

  /* 某格能填哪些數字（用 bitmask，快很多） */
  function usedMask(g, i, d) {
    var n = d.n, r = Math.floor(i / n), c = i % n, m = 0, k;
    for (k = 0; k < n; k++) {
      m |= (1 << g[r * n + k]);
      m |= (1 << g[k * n + c]);
    }
    var r0 = Math.floor(r / d.br) * d.br, c0 = Math.floor(c / d.bc) * d.bc;
    for (var rr = 0; rr < d.br; rr++)
      for (var cc = 0; cc < d.bc; cc++)
        m |= (1 << g[(r0 + rr) * n + (c0 + cc)]);
    return m;
  }

  /* 隨機填出一個完整解 */
  function makeFull(d) {
    var n = d.n, g = new Array(n * n).fill(0);
    function go(i) {
      if (i === n * n) return true;
      if (g[i]) return go(i + 1);
      var m = usedMask(g, i, d), order = shuffled(n);
      for (var q = 0; q < n; q++) {
        var v = order[q];
        if (m & (1 << v)) continue;
        g[i] = v;
        if (go(i + 1)) return true;
        g[i] = 0;
      }
      return false;
    }
    go(0);
    return g;
  }

  /* 數解的個數，最多數到 limit 就停 —— 用來確認題目只有一個答案 */
  function countSolutions(g, d, limit) {
    var n = d.n, work = g.slice(), found = 0;

    function go() {
      /* 選候選最少的格子，剪枝效果最好 */
      var best = -1, bestMask = 0, bestCount = 99;
      for (var i = 0; i < n * n; i++) {
        if (work[i]) continue;
        var m = usedMask(work, i, d), c = 0;
        for (var v = 1; v <= n; v++) if (!(m & (1 << v))) c++;
        if (c === 0) return false;
        if (c < bestCount) { bestCount = c; best = i; bestMask = m; if (c === 1) break; }
      }
      if (best === -1) { found++; return found >= limit; }
      for (var w = 1; w <= n; w++) {
        if (bestMask & (1 << w)) continue;
        work[best] = w;
        if (go()) { work[best] = 0; return true; }
        work[best] = 0;
      }
      return false;
    }

    go();
    return found;
  }

  /* 從完整解挖洞，每挖一格都確認答案還是唯一 */
  function dig(full, d) {
    var n = d.n, g = full.slice(), total = n * n;
    var order = [];
    for (var i = 0; i < total; i++) order.push(i);
    for (var j = order.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = order[j]; order[j] = order[k]; order[k] = t;
    }
    var left = total;
    for (var q = 0; q < order.length && left > d.givens; q++) {
      var p = order[q], keep = g[p];
      g[p] = 0;
      if (countSolutions(g, d, 2) !== 1) g[p] = keep;
      else left--;
    }
    return g;
  }

  function makePuzzle(d) {
    var full = makeFull(d);
    return { solution: full, puzzle: dig(full, d) };
  }

  /* ================= 畫面 ================= */

  function el(id) { return host.querySelector('#' + id); }
  function tip(t) { var e = el('sTip'); if (e) e.textContent = t || ''; }

  function fmt(ms) {
    var s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }

  function drawBar() {
    bar.innerHTML =
      '<button class="g-mode" id="sMode" aria-label="更改難度"><b>' + S.diff.name + '</b><span>' + S.diff.sub + '</span></button>' +
      '<span class="s-time" id="sTime">0:00</span>' +
      '<button class="iconbtn" id="sNew" style="margin-left:auto" aria-label="換一題">&#8635;</button>';
    bar.querySelector('#sMode').addEventListener('click', function () { diffSheet(); });
    bar.querySelector('#sNew').addEventListener('click', askNew);
  }

  function peers(a, b, d) {
    if (a === b) return false;
    var n = d.n;
    var ra = Math.floor(a / n), ca = a % n, rb = Math.floor(b / n), cb = b % n;
    return ra === rb || ca === cb || boxOf(a, d) === boxOf(b, d);
  }

  function drawGrid() {
    var d = S.diff, n = d.n, g = el('sGrid');
    g.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
    g.style.fontSize = (n === 9 ? 'clamp(17px, 5.2vw, 26px)' : 'clamp(20px, 7vw, 34px)');

    var h = '';
    for (var i = 0; i < n * n; i++) {
      var r = Math.floor(i / n), c = i % n;
      var cls = 's-cell';
      if (S.puzzle[i]) cls += ' given';
      if (i === S.sel) cls += ' sel';
      else if (S.sel > -1 && peers(i, S.sel, d)) cls += ' peer';
      var v = S.puzzle[i] || S.user[i];
      if (S.sel > -1 && v && v === (S.puzzle[S.sel] || S.user[S.sel]) && i !== S.sel) cls += ' same';
      /* 「填錯馬上變紅」關掉時，只有按了「檢查」才會標出來 */
      if ((S.flagOn || S.reveal) && !S.puzzle[i] && S.user[i] && S.user[i] !== S.solution[i]) cls += ' bad';
      if ((c + 1) % d.bc === 0 && c !== n - 1) cls += ' br';
      if ((r + 1) % d.br === 0 && r !== n - 1) cls += ' bb';

      var inner = '';
      if (v) inner = v;
      else if (S.notes[i] && S.notes[i].length) {
        inner = '<span class="s-notes" style="grid-template-columns:repeat(' + (n === 9 ? 3 : 3) + ',1fr)">';
        for (var q = 1; q <= n; q++) inner += '<span>' + (S.notes[i].indexOf(q) > -1 ? q : '') + '</span>';
        inner += '</span>';
      }
      h += '<button class="' + cls + '" data-i="' + i + '">' + inner + '</button>';
    }
    g.innerHTML = h;
  }

  function drawKeys() {
    var n = S.diff.n;
    var k = el('sKeys');
    k.style.gridTemplateColumns = 'repeat(' + (n === 9 ? 5 : 3) + ', 1fr)';
    var h = '';
    for (var v = 1; v <= n; v++) {
      var cnt = 0;
      for (var i = 0; i < n * n; i++) if ((S.puzzle[i] || S.user[i]) === v) cnt++;
      h += '<button class="s-key' + (cnt >= n ? ' done' : '') + '" data-v="' + v + '">' + v + '</button>';
    }
    k.innerHTML = h;

    var note = el('sNote');
    note.className = 's-act' + (S.noteMode ? ' on' : '');
    note.innerHTML = '筆記<span class="st">' + (S.noteMode ? '開' : '關') + '</span>';

    /* 沒有即時提醒時，多給一顆「檢查」，不然填錯了完全沒辦法知道 */
    var acts = el('sActions');
    acts.style.gridTemplateColumns = S.flagOn ? '1fr 1fr' : '1fr 1fr 1fr';
    el('sCheck').style.display = S.flagOn ? 'none' : '';
  }

  function draw() { drawBar(); drawGrid(); drawKeys(); }

  /* ================= 操作 ================= */

  function put(v) {
    var i = S.sel;
    if (i < 0) { tip('先點一個空格'); return; }
    if (S.puzzle[i]) { tip('這格是題目給的，不能改'); return; }

    S.reveal = false;

    if (S.noteMode && v) {
      var arr = S.notes[i] || (S.notes[i] = []);
      var at = arr.indexOf(v);
      if (at > -1) arr.splice(at, 1); else arr.push(v);
      S.user[i] = 0;
      draw();
      return;
    }

    if (!v) { S.user[i] = 0; S.notes[i] = []; draw(); tip(''); return; }

    S.user[i] = v;
    S.notes[i] = [];
    if (v !== S.solution[i]) {
      S.mistakes++;
      tip(S.flagOn ? '這格不對，再想想' : '');
    } else tip('');
    draw();
    checkWin();
  }

  /* 目前填錯的格數 */
  function wrongCount() {
    var n = S.diff.n, w = 0;
    for (var i = 0; i < n * n; i++) if (!S.puzzle[i] && S.user[i] && S.user[i] !== S.solution[i]) w++;
    return w;
  }

  function checkWin() {
    var n = S.diff.n, empty = 0;
    for (var i = 0; i < n * n; i++) if (!(S.puzzle[i] || S.user[i])) empty++;
    if (empty) return;

    var wrong = wrongCount();
    if (wrong) {
      /* 填滿了但有錯 —— 沒開即時提醒的話要講一聲，不然會一直卡著 */
      if (!S.flagOn) tip('填滿了，但有 ' + wrong + ' 格不對，按「檢查」看是哪幾格');
      return;
    }
    S.done = true;
    stopClock();
    win();
  }

  function startClock() {
    stopClock();
    S.t0 = Date.now() - S.elapsed;
    ticker = setInterval(function () {
      if (!S || S.done) return;
      S.elapsed = Date.now() - S.t0;
      var e = el('sTime');
      if (e) e.textContent = fmt(S.elapsed);
    }, 500);
  }
  function stopClock() { if (ticker) { clearInterval(ticker); ticker = null; } }

  /* ================= 一局結束 ================= */

  function win() {
    var d = S.diff;
    var secs = Math.floor(S.elapsed / 1000);
    var bk = 'sbest.' + d.key;
    var old = parseInt(App.store(bk) || '0', 10);
    var isBest = !old || secs < old;
    if (isBest) App.store(bk, secs);

    var clean = S.mistakes === 0 ? Math.round(d.base * 0.4) : 0;
    var brave = S.flagOn ? 0 : Math.round(d.base * 0.4);   /* 關掉即時提醒比較難，多給 */
    var earned = d.base + clean + brave;
    App.addCoins(earned);

    var ev = { game: 'sudoku', mistakes: S.mistakes, secs: secs, level: d.key };
    var r1 = App.report(Object.assign({ type: 'finish' }, ev));
    var r2 = App.report(Object.assign({ type: 'win' }, ev));
    S.counted = true;

    var bonus = r1.earned + r2.earned;
    var doneTxt = r1.done.concat(r2.done);

    var idx = DIFFS.indexOf(d), next = DIFFS[idx + 1];

    App.openSheet(
      '<div class="s-win">' +
        '<div class="cap">完成！花了</div>' +
        '<div class="big">' + fmt(S.elapsed) + '</div>' +
        '<div class="steps">' +
          (S.mistakes === 0 ? '全程沒填錯' : '填錯 ' + S.mistakes + ' 次') +
          (S.checks ? ' · 檢查 ' + S.checks + ' 次' : '') +
          (isBest ? ' · 這個難度最快紀錄！' : (old ? ' · 最快 ' + fmt(old * 1000) : '')) +
        '</div>' +
        '<div class="earn"><span class="coin"></span>+' + earned + ' 腦力點' +
          (clean && brave ? '（全對＋自己找錯加成）' : clean ? '（含全對加成）' : brave ? '（含自己找錯加成）' : '') +
        '</div>' +
        (bonus ? '<div class="earn bonus">挑戰完成：' + doneTxt.join('、') + '　<span class="coin"></span>+' + bonus + '</div>' : '') +
        '<button class="btn-main" data-act="again">再來一題</button>' +
        (next ? '<button class="btn-ghost" data-act="up">試試看「' + next.name + '」</button>' : '') +
      '</div>',
      function (b) {
        if (b.dataset.act === 'up') {
          var k = DIFFS.indexOf(S.diff);
          if (DIFFS[k + 1]) { S.diff = DIFFS[k + 1]; App.store('sdiff', S.diff.key); }
        }
        App.closeSheet();
      },
      function () { fresh(); }
    );
  }

  /* ================= 換題 / 難度 ================= */

  function fresh() {
    S.done = true;            /* 出題時先鎖住輸入 */
    stopClock();
    el('sWrap').innerHTML = '<div class="s-loading">出題中…</div>';
    bar.innerHTML = '';
    /* 讓「出題中」先畫出來，再做比較花時間的運算 */
    setTimeout(function () {
      if (!S) return;
      var made = makePuzzle(S.diff);
      var n = S.diff.n;
      S.solution = made.solution;
      S.puzzle = made.puzzle;
      S.user = new Array(n * n).fill(0);
      S.notes = new Array(n * n);
      S.sel = -1;
      S.mistakes = 0;
      S.checks = 0;
      S.reveal = false;
      S.elapsed = 0;
      S.counted = false;
      S.done = false;
      el('sWrap').innerHTML = '<div class="s-grid" id="sGrid"></div>';
      draw();
      tip('');
      startClock();
    }, 30);
  }

  function askNew() {
    var filled = 0;
    for (var i = 0; i < S.user.length; i++) if (S.user[i]) filled++;
    if (!filled || S.done) { fresh(); return; }
    App.openSheet(
      '<h2>換一題新的？<small>這題已經填了 ' + filled + ' 格，換掉就沒了</small></h2>' +
      '<button class="btn-main" data-act="yes">好，換新的</button>' +
      '<button class="btn-ghost" data-act="no">繼續解</button>',
      function (b) { App.closeSheet(); if (b.dataset.act === 'yes') fresh(); }
    );
  }

  function diffSheet() {
    var h = '<h2>難度<small>從入門開始，順了再往上；每一題都保證只有一個答案</small></h2><div class="opts">';
    for (var i = 0; i < DIFFS.length; i++) {
      var d = DIFFS[i];
      var best = App.store('sbest.' + d.key);
      h += '<button class="opt ' + (d.key === S.diff.key ? 'on' : '') + '" data-sdiff="' + d.key + '">' +
             '<span class="nm">' + d.name + '</span>' +
             '<span class="tag">' + (d.n === 6 ? '6×6' : '9×9') + ' · 給 ' + d.givens + ' 格</span>' +
             '<span class="best">' + (best ? '最快 ' + fmt(best * 1000) : '') + '</span>' +
           '</button>';
    }
    h += '</div>' +
      '<button class="toggle ' + (S.flagOn ? 'on' : '') + '" data-act="flag">' +
        '<span class="lb">填錯馬上變紅' +
          '<small>' + (S.flagOn ? '填錯的格子會立刻標紅色' : '自己找錯，多給四成腦力點；可以按「檢查」') + '</small>' +
        '</span><span class="sw"></span>' +
      '</button>' +
      '<button class="btn-main" data-act="ok">好</button>';

    App.openSheet(h, function (b) {
      if (b.dataset.sdiff) {
        for (var k = 0; k < DIFFS.length; k++) if (DIFFS[k].key === b.dataset.sdiff) S.diff = DIFFS[k];
        App.store('sdiff', S.diff.key);
        App.closeSheet();
        fresh();
        return;
      }
      if (b.dataset.act === 'flag') {
        S.flagOn = !S.flagOn;
        App.store('sflag', S.flagOn ? '1' : '0');
        S.reveal = false;
        draw();
        tip('');
        diffSheet();
        return;
      }
      App.closeSheet();
    });
  }

  /* ================= 掛載 ================= */

  function mount(bodyEl, barEl) {
    host = bodyEl; bar = barEl;

    host.innerHTML =
      '<div class="s-wrap" id="sWrap"><div class="s-grid" id="sGrid"></div></div>' +
      '<div class="s-pad">' +
        '<div class="s-keys" id="sKeys"></div>' +
        '<div class="s-actions" id="sActions">' +
          '<button class="s-act" id="sNote">筆記<span class="st">關</span></button>' +
          '<button class="s-act" id="sClear">清除這格</button>' +
          '<button class="s-act" id="sCheck" style="display:none">檢查</button>' +
        '</div>' +
        '<div class="s-tip" id="sTip"></div>' +
      '</div>';

    var dk = App.store('sdiff'), d = DIFFS[0];
    for (var i = 0; i < DIFFS.length; i++) if (DIFFS[i].key === dk) d = DIFFS[i];

    S = { diff: d, solution: [], puzzle: [], user: [], notes: [], sel: -1,
          noteMode: false, mistakes: 0, checks: 0, reveal: false,
          flagOn: App.store('sflag') !== '0',
          elapsed: 0, t0: 0, counted: false, done: true };

    el('sWrap').addEventListener('click', function (e) {
      var c = e.target.closest('.s-cell');
      if (!c || S.done) return;
      S.sel = parseInt(c.dataset.i, 10);
      drawGrid();
    });

    el('sKeys').addEventListener('click', function (e) {
      var b = e.target.closest('.s-key');
      if (!b || S.done) return;
      put(parseInt(b.dataset.v, 10));
    });

    el('sNote').addEventListener('click', function () {
      if (S.done) return;
      S.noteMode = !S.noteMode;
      drawKeys();
      tip(S.noteMode ? '筆記模式：填的是小字，不會算錯' : '');
    });

    el('sClear').addEventListener('click', function () {
      if (S.done) return;
      put(0);
    });

    el('sCheck').addEventListener('click', function () {
      if (S.done) return;
      var w = wrongCount();
      S.checks++;
      S.reveal = true;
      drawGrid();
      tip(w ? '有 ' + w + ' 格不對，標紅色的那幾格' : '目前填的都是對的');
    });

    fresh();
  }

  function unmount() {
    stopClock();
    if (S && !S.counted && !S.done) {
      var filled = 0;
      for (var i = 0; i < S.user.length; i++) if (S.user[i]) filled++;
      if (filled) {
        App.report({ type: 'finish', game: 'sudoku', mistakes: S.mistakes, secs: Math.floor(S.elapsed / 1000), level: S.diff.key });
        S.counted = true;
      }
    }
    S = null; host = null; bar = null;
  }

  App.register({
    id: 'sudoku',
    name: '數獨',
    tagline: '把九宮格填滿，不能重複',
    ready: true,
    mark:
      '<svg viewBox="0 0 52 52" fill="none" aria-hidden="true">' +
      '<rect x="2.5" y="2.5" width="47" height="47" rx="7" stroke="currentColor" stroke-width="2.5"/>' +
      '<path d="M18.3 3v46M33.7 3v46M3 18.3h46M3 33.7h46" stroke="currentColor" stroke-width="1.6" opacity=".45"/>' +
      '<text x="10.4" y="15.6" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="currentColor">5</text>' +
      '<text x="41.6" y="15.6" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="currentColor">3</text>' +
      '<text x="26" y="31" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="currentColor">7</text>' +
      '<text x="10.4" y="46.4" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="currentColor">1</text>' +
      '</svg>',
    help:
      '<div class="hstep"><span class="hnum">1</span><div class="hbody">' +
        '<b>每一橫排、每一直排、每一個粗框小格區，數字都不能重複</b>' +
        '<div class="hnote">9 格的盤面就是 1 到 9 各出現一次；6 格的盤面是 1 到 6</div>' +
      '</div></div>' +

      '<div class="hstep"><span class="hnum">2</span><div class="hbody">' +
        '<b>先點格子，再按下面的數字</b>' +
        '<div class="hnote">點格子只是「選起來」，不會填東西進去 —— <u>點錯再點一次就好，沒有代價</u>。' +
        '選起來之後，同一排、同一區會一起變色，比較好看。</div>' +
      '</div></div>' +

      '<div class="hstep"><span class="hnum">3</span><div class="hbody">' +
        '<b>填錯會馬上變紅</b>' +
        '<div class="hnote">不用等到最後才發現整盤要重來。' +
        '想自己找錯的話，可以在左上角的難度裡把它關掉，<em>關掉腦力點多給四成</em>。</div>' +
      '</div></div>' +

      '<div class="hstep"><span class="hnum">4</span><div class="hbody">' +
        '<b>想不出來就用「筆記」</b>' +
        '<div class="hnote">把可能的數字先用小字記在格子裡，不算答案。難的關卡幾乎一定要用。' +
        '<br><em>沒有倒數計時，也不會輸，慢慢想。</em></div>' +
      '</div></div>',

    score: function () {
      for (var i = DIFFS.length - 1; i >= 0; i--) {
        var b = App.store('sbest.' + DIFFS[i].key);
        if (b) return DIFFS[i].name + '最快 ' + fmt(b * 1000);
      }
      return '';
    },
    mount: mount,
    unmount: unmount
  });
})();


/* === games/nonogram.js === */
/* ===========================================================
   數織（Nonogram）
   出題保證「只靠推理就解得出來」—— 不用猜，猜錯不是玩家的錯
   =========================================================== */
(function () {

  /* 難度不是一味放大盤面 —— 格子小到點不準就違反這個 App 的原則了。
     10×10 之後改用「圖案越稀疏、越要推理」來加難度，格子維持看得到、點得到。 */
  var DIFFS = [
    { key: 'a5',  name: '入門', n: 5,  density: 0.58, base: 8,  hint: '格子最大' },
    { key: 'b8',  name: '簡單', n: 8,  density: 0.55, base: 14, hint: '' },
    { key: 'c10', name: '普通', n: 10, density: 0.52, base: 22, hint: '' },
    { key: 'd10', name: '進階', n: 10, density: 0.42, base: 32, hint: '圖案較散' },
    { key: 'e10', name: '困難', n: 10, density: 0.34, base: 45, hint: '很散，要慢慢推' }
  ];

  var S = null, host = null, bar = null, ticker = null;

  /* ================= 出題 ================= */

  /* 一條線的提示：連續塗格的長度 */
  function cluesOf(line) {
    var out = [], run = 0;
    for (var i = 0; i < line.length; i++) {
      if (line[i]) run++;
      else if (run) { out.push(run); run = 0; }
    }
    if (run) out.push(run);
    return out.length ? out : [0];
  }

  /* 給提示和目前已知狀態，列出所有排法的交集。
     cells: 0=未知 1=塗 2=空。回傳新的 cells，或 null 表示無解 */
  function solveLine(clues, cells) {
    var n = cells.length;
    var fillCount = new Array(n).fill(0);
    var emptyCount = new Array(n).fill(0);
    var total = 0;

    if (clues.length === 1 && clues[0] === 0) {
      for (var z = 0; z < n; z++) { if (cells[z] === 1) return null; }
      return cells.map(function () { return 2; });
    }

    var arrange = new Array(n);

    function place(ci, pos) {
      if (total > 40000) return;                 /* 保險絲 */
      if (ci === clues.length) {
        for (var k = pos; k < n; k++) {
          if (cells[k] === 1) return;
          arrange[k] = 2;
        }
        total++;
        for (var q = 0; q < n; q++) {
          if (arrange[q] === 1) fillCount[q]++; else emptyCount[q]++;
        }
        return;
      }
      var len = clues[ci];
      for (var start = pos; start + len <= n; start++) {
        var ok = true, j;
        for (j = pos; j < start; j++) { if (cells[j] === 1) { ok = false; break; } }
        if (!ok) break;                          /* 跳過了必須塗的格子，再往後也不行 */
        for (j = start; j < start + len; j++) { if (cells[j] === 2) { ok = false; break; } }
        if (!ok) continue;
        var after = start + len;
        if (after < n && cells[after] === 1) continue;   /* 後面要留一格空 */

        for (j = pos; j < start; j++) arrange[j] = 2;
        for (j = start; j < after; j++) arrange[j] = 1;
        if (after < n) arrange[after] = 2;
        place(ci + 1, after < n ? after + 1 : n);
      }
    }

    place(0, 0);
    if (!total) return null;

    var out = cells.slice();
    for (var i = 0; i < n; i++) {
      if (fillCount[i] === total) out[i] = 1;
      else if (emptyCount[i] === total) out[i] = 2;
    }
    return out;
  }

  /* 只用逐行逐列推理去解。解得完 = 這題不用猜 */
  function logicSolve(rowClues, colClues, n) {
    var g = new Array(n * n).fill(0);
    var changed = true, guard = 0;

    while (changed && guard++ < 60) {
      changed = false;

      for (var r = 0; r < n; r++) {
        var row = [];
        for (var c = 0; c < n; c++) row.push(g[r * n + c]);
        var nr = solveLine(rowClues[r], row);
        if (!nr) return null;
        for (c = 0; c < n; c++) {
          if (nr[c] !== g[r * n + c]) { g[r * n + c] = nr[c]; changed = true; }
        }
      }

      for (var cc = 0; cc < n; cc++) {
        var col = [];
        for (var rr = 0; rr < n; rr++) col.push(g[rr * n + cc]);
        var nc = solveLine(colClues[cc], col);
        if (!nc) return null;
        for (rr = 0; rr < n; rr++) {
          if (nc[rr] !== g[rr * n + cc]) { g[rr * n + cc] = nc[rr]; changed = true; }
        }
      }
    }

    for (var i = 0; i < n * n; i++) if (g[i] === 0) return null;   /* 有格子推不出來 */
    return g;
  }

  function makePuzzle(d) {
    var n = d.n;
    /* 越稀疏的圖越難生出「不用猜」的題目，所以要多試幾次。
       一次約 1ms，200 次也還在瞬間的範圍。 */
    for (var attempt = 0; attempt < 200; attempt++) {
      var sol = [];
      for (var i = 0; i < n * n; i++) sol.push(Math.random() < d.density ? 1 : 0);

      var rowClues = [], colClues = [], r, c, line;
      for (r = 0; r < n; r++) {
        line = [];
        for (c = 0; c < n; c++) line.push(sol[r * n + c]);
        rowClues.push(cluesOf(line));
      }
      for (c = 0; c < n; c++) {
        line = [];
        for (r = 0; r < n; r++) line.push(sol[r * n + c]);
        colClues.push(cluesOf(line));
      }

      var solved = logicSolve(rowClues, colClues, n);
      if (!solved) continue;

      /* 推理解出來的必須跟原圖一樣（不一樣代表原圖不是唯一解） */
      var same = true;
      for (i = 0; i < n * n; i++) {
        if ((solved[i] === 1 ? 1 : 0) !== sol[i]) { same = false; break; }
      }
      if (same) return { sol: sol, rowClues: rowClues, colClues: colClues };
    }
    return null;
  }

  /* ================= 畫面 ================= */

  function el(id) { return host.querySelector('#' + id); }
  function tip(t) { var e = el('nTip'); if (e) e.textContent = t || ''; }

  function fmt(ms) {
    var s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }

  function drawBar() {
    bar.innerHTML =
      '<button class="g-mode" id="nMode" aria-label="更改難度"><b>' + S.diff.name + '</b><span>' + S.diff.n + '×' + S.diff.n + '</span></button>' +
      '<span class="s-time" id="nTime">0:00</span>' +
      '<button class="iconbtn" id="nNew" style="margin-left:auto" aria-label="換一題">&#8635;</button>';
    bar.querySelector('#nMode').addEventListener('click', diffSheet);
    bar.querySelector('#nNew').addEventListener('click', askNew);
  }

  /* 這一行/列是不是已經完成了（提示可以變灰） */
  function lineDone(idx, isRow) {
    var n = S.diff.n, line = [], k;
    for (k = 0; k < n; k++) line.push(S.user[isRow ? idx * n + k : k * n + idx] === 1 ? 1 : 0);
    var want = isRow ? S.rowClues[idx] : S.colClues[idx];
    var got = cluesOf(line);
    if (want.length !== got.length) return false;
    for (k = 0; k < want.length; k++) if (want[k] !== got[k]) return false;
    return true;
  }

  function drawGrid() {
    var d = S.diff, n = d.n;
    var maxRow = 1, maxCol = 1, i;
    for (i = 0; i < n; i++) {
      if (S.rowClues[i].length > maxRow) maxRow = S.rowClues[i].length;
      if (S.colClues[i].length > maxCol) maxCol = S.colClues[i].length;
    }

    var g = el('nGrid');
    /* 提示欄比格子窄一點，把空間讓給可以點的格子 */
    g.style.gridTemplateColumns = 'repeat(' + maxRow + ', 0.62fr) repeat(' + n + ', 1fr)';
    g.style.gridTemplateRows = 'repeat(' + maxCol + ', 0.62fr) repeat(' + n + ', 1fr)';

    var h = '', r, c, k;

    /* 左上角空白 + 上方直排提示 */
    for (r = 0; r < maxCol; r++) {
      for (c = 0; c < maxRow; c++) h += '<div class="n-corner"></div>';
      for (c = 0; c < n; c++) {
        var cl = S.colClues[c];
        var off = maxCol - cl.length;
        var v = (r >= off && cl[r - off] !== 0) ? cl[r - off] : '';
        h += '<div class="n-clue' + (lineDone(c, false) ? ' done' : '') + '">' + v + '</div>';
      }
    }

    /* 每一列：左邊橫排提示 + 格子 */
    for (r = 0; r < n; r++) {
      var rl = S.rowClues[r], roff = maxRow - rl.length;
      for (c = 0; c < maxRow; c++) {
        var rv = (c >= roff && rl[c - roff] !== 0) ? rl[c - roff] : '';
        h += '<div class="n-clue' + (lineDone(r, true) ? ' done' : '') + '">' + rv + '</div>';
      }
      for (c = 0; c < n; c++) {
        k = r * n + c;
        var cls = 'n-cell';
        var v2 = S.user[k];
        if (v2 === 1) cls += (S.flagOn || S.reveal) && !S.sol[k] ? ' bad' : ' fill';
        else if (v2 === 2) cls += ' cross';
        if (c % 5 === 0) cls += ' b5l';
        if (r % 5 === 0) cls += ' b5t';
        if (c === n - 1) cls += ' edgeR';
        if (r === n - 1) cls += ' edgeB';
        h += '<button class="' + cls + '" data-k="' + k + '"></button>';
      }
    }
    g.innerHTML = h;

    /* 提示字級跟著實際格子大小走 —— 寫死 vw 會在小螢幕上縮到看不見 */
    var cell = g.querySelector('.n-cell');
    if (cell) {
      var w = cell.getBoundingClientRect().width;
      if (w) g.style.fontSize = Math.max(11, Math.round(w * 0.52)) + 'px';
    }
  }

  function drawModes() {
    el('nFill').className = 'n-mode' + (S.mode === 1 ? ' on' : '');
    el('nCross').className = 'n-mode' + (S.mode === 2 ? ' on' : '');
    el('nCheck').style.display = S.flagOn ? 'none' : '';
    el('nActions').style.gridTemplateColumns = S.flagOn ? '1fr' : '1fr 1fr';
  }

  function draw() { drawBar(); drawGrid(); drawModes(); }

  /* ================= 操作 ================= */

  function toggle(k) {
    if (S.done) return;
    S.reveal = false;
    var want = S.mode;
    S.user[k] = (S.user[k] === want) ? 0 : want;
    if (want === 1 && S.user[k] === 1 && !S.sol[k]) {
      S.mistakes++;
      tip(S.flagOn ? '這格不該塗，再看看提示' : '');
    } else tip('');
    drawGrid();
    checkWin();
  }

  function wrongCount() {
    var w = 0;
    for (var i = 0; i < S.user.length; i++) if (S.user[i] === 1 && !S.sol[i]) w++;
    return w;
  }

  function checkWin() {
    for (var i = 0; i < S.sol.length; i++) {
      if (S.sol[i] && S.user[i] !== 1) return;
      if (!S.sol[i] && S.user[i] === 1) return;
    }
    S.done = true;
    stopClock();
    win();
  }

  function startClock() {
    stopClock();
    S.t0 = Date.now() - S.elapsed;
    ticker = setInterval(function () {
      if (!S || S.done) return;
      S.elapsed = Date.now() - S.t0;
      var e = el('nTime');
      if (e) e.textContent = fmt(S.elapsed);
    }, 500);
  }
  function stopClock() { if (ticker) { clearInterval(ticker); ticker = null; } }

  /* ================= 一局結束 ================= */

  function win() {
    var d = S.diff;
    var secs = Math.floor(S.elapsed / 1000);
    var bk = 'nbest.' + d.key;
    var old = parseInt(App.store(bk) || '0', 10);
    var isBest = !old || secs < old;
    if (isBest) App.store(bk, secs);

    var clean = S.mistakes === 0 ? Math.round(d.base * 0.4) : 0;
    var brave = S.flagOn ? 0 : Math.round(d.base * 0.4);
    var earned = d.base + clean + brave;
    App.addCoins(earned);

    var ev = { game: 'nonogram', mistakes: S.mistakes, secs: secs, level: d.key };
    var r1 = App.report(Object.assign({ type: 'finish' }, ev));
    var r2 = App.report(Object.assign({ type: 'win' }, ev));
    S.counted = true;

    var bonus = r1.earned + r2.earned;
    var doneTxt = r1.done.concat(r2.done);

    /* 把解出來的圖單獨秀一次 */
    var n = d.n, pic = '<div class="n-pic" style="grid-template-columns:repeat(' + n + ',1fr)">';
    for (var i = 0; i < n * n; i++) pic += '<i class="' + (S.sol[i] ? 'on' : '') + '"></i>';
    pic += '</div>';

    var idx = DIFFS.indexOf(d), next = DIFFS[idx + 1];

    App.openSheet(
      '<div class="n-win">' +
        pic +
        '<div class="cap">完成！花了</div>' +
        '<div class="big">' + fmt(S.elapsed) + '</div>' +
        '<div class="steps">' +
          (S.mistakes === 0 ? '全程沒塗錯' : '塗錯 ' + S.mistakes + ' 次') +
          (isBest ? ' · 這個難度最快紀錄！' : (old ? ' · 最快 ' + fmt(old * 1000) : '')) +
        '</div>' +
        '<div class="earn"><span class="coin"></span>+' + earned + ' 腦力點' +
          (clean && brave ? '（全對＋自己找錯加成）' : clean ? '（含全對加成）' : brave ? '（含自己找錯加成）' : '') +
        '</div>' +
        (bonus ? '<div class="earn bonus">挑戰完成：' + doneTxt.join('、') + '　<span class="coin"></span>+' + bonus + '</div>' : '') +
        '<button class="btn-main" data-act="again">再來一題</button>' +
        (next ? '<button class="btn-ghost" data-act="up">試試看「' + next.name + '」</button>' : '') +
      '</div>',
      function (b) {
        if (b.dataset.act === 'up') {
          var k = DIFFS.indexOf(S.diff);
          if (DIFFS[k + 1]) { S.diff = DIFFS[k + 1]; App.store('ndiff', S.diff.key); }
        }
        App.closeSheet();
      },
      function () { fresh(); }
    );
  }

  /* ================= 換題 / 難度 ================= */

  function fresh() {
    S.done = true;
    stopClock();
    el('nWrap').innerHTML = '<div class="n-loading">出題中…</div>';
    bar.innerHTML = '';
    setTimeout(function () {
      if (!S) return;
      var made = makePuzzle(S.diff);
      /* 極少數情況出不出來：先原難度再試一輪，真的不行才放寬密度
         （放寬等於偷偷降難度，所以擺在最後） */
      if (!made) made = makePuzzle(S.diff);
      if (!made) made = makePuzzle({ n: S.diff.n, density: S.diff.density + 0.08 });
      if (!made) { el('nWrap').innerHTML = '<div class="n-loading">出題失敗，請按右上角再試一次</div>'; drawBar(); return; }
      var n = S.diff.n;
      S.sol = made.sol;
      S.rowClues = made.rowClues;
      S.colClues = made.colClues;
      S.user = new Array(n * n).fill(0);
      S.mistakes = 0;
      S.reveal = false;
      S.elapsed = 0;
      S.counted = false;
      S.done = false;
      el('nWrap').innerHTML = '<div class="n-grid" id="nGrid"></div>';
      draw();
      tip('');
      startClock();
    }, 30);
  }

  function askNew() {
    var filled = 0;
    for (var i = 0; i < S.user.length; i++) if (S.user[i]) filled++;
    if (!filled || S.done) { fresh(); return; }
    App.openSheet(
      '<h2>換一題新的？<small>這題已經動了 ' + filled + ' 格，換掉就沒了</small></h2>' +
      '<button class="btn-main" data-act="yes">好，換新的</button>' +
      '<button class="btn-ghost" data-act="no">繼續解</button>',
      function (b) { App.closeSheet(); if (b.dataset.act === 'yes') fresh(); }
    );
  }

  function diffSheet() {
    var h = '<h2>難度<small>每一題都保證只靠推理解得出來，不用猜</small></h2><div class="opts">';
    for (var i = 0; i < DIFFS.length; i++) {
      var d = DIFFS[i];
      var best = App.store('nbest.' + d.key);
      h += '<button class="opt ' + (d.key === S.diff.key ? 'on' : '') + '" data-ndiff="' + d.key + '">' +
             '<span class="nm">' + d.name + '</span>' +
             '<span class="tag">' + d.n + '×' + d.n + (d.hint ? ' · ' + d.hint : '') + '</span>' +
             '<span class="best">' + (best ? '最快 ' + fmt(best * 1000) : '') + '</span>' +
           '</button>';
    }
    h += '</div>' +
      '<button class="toggle ' + (S.flagOn ? 'on' : '') + '" data-act="flag">' +
        '<span class="lb">塗錯馬上變紅' +
          '<small>' + (S.flagOn ? '塗到不該塗的格子會立刻變紅' : '自己找錯，多給四成腦力點；可以按「檢查」') + '</small>' +
        '</span><span class="sw"></span>' +
      '</button>' +
      '<button class="btn-main" data-act="ok">好</button>';

    App.openSheet(h, function (b) {
      if (b.dataset.ndiff) {
        for (var k = 0; k < DIFFS.length; k++) if (DIFFS[k].key === b.dataset.ndiff) S.diff = DIFFS[k];
        App.store('ndiff', S.diff.key);
        App.closeSheet();
        fresh();
        return;
      }
      if (b.dataset.act === 'flag') {
        S.flagOn = !S.flagOn;
        App.store('nflag', S.flagOn ? '1' : '0');
        S.reveal = false;
        draw();
        diffSheet();
        return;
      }
      App.closeSheet();
    });
  }

  /* ================= 掛載 ================= */

  function mount(bodyEl, barEl) {
    host = bodyEl; bar = barEl;

    host.innerHTML =
      '<div class="n-wrap" id="nWrap"><div class="n-grid" id="nGrid"></div></div>' +
      '<div class="n-pad">' +
        '<div class="n-modes">' +
          '<button class="n-mode on" id="nFill"><span class="n-swatch f"></span>塗滿</button>' +
          '<button class="n-mode" id="nCross"><span class="n-swatch x"></span>打叉</button>' +
        '</div>' +
        '<div class="n-actions" id="nActions">' +
          '<button class="n-act" id="nClear">全部清掉</button>' +
          '<button class="n-act" id="nCheck" style="display:none">檢查</button>' +
        '</div>' +
        '<div class="n-tip" id="nTip"></div>' +
      '</div>';

    var dk = App.store('ndiff'), d = DIFFS[0];
    for (var i = 0; i < DIFFS.length; i++) if (DIFFS[i].key === dk) d = DIFFS[i];

    S = { diff: d, sol: [], rowClues: [], colClues: [], user: [],
          mode: 1, mistakes: 0, reveal: false,
          flagOn: App.store('nflag') !== '0',
          elapsed: 0, t0: 0, counted: false, done: true };

    el('nWrap').addEventListener('click', function (e) {
      var c = e.target.closest('.n-cell');
      if (c) toggle(parseInt(c.dataset.k, 10));
    });

    el('nFill').addEventListener('click', function () { S.mode = 1; drawModes(); tip(''); });
    el('nCross').addEventListener('click', function () { S.mode = 2; drawModes(); tip('打叉是給自己做記號用的，不算答案'); });

    el('nClear').addEventListener('click', function () {
      if (S.done) return;
      var any = false;
      for (var i = 0; i < S.user.length; i++) if (S.user[i]) any = true;
      if (!any) return;
      App.openSheet(
        '<h2>把這題塗的全部清掉？<small>題目不換，只是重新開始塗</small></h2>' +
        '<button class="btn-main" data-act="yes">好，清掉</button>' +
        '<button class="btn-ghost" data-act="no">不要</button>',
        function (b) {
          App.closeSheet();
          if (b.dataset.act === 'yes') {
            S.user = new Array(S.diff.n * S.diff.n).fill(0);
            S.reveal = false;
            drawGrid(); tip('');
          }
        }
      );
    });

    el('nCheck').addEventListener('click', function () {
      if (S.done) return;
      var w = wrongCount();
      S.checks = (S.checks || 0) + 1;
      S.reveal = true;
      drawGrid();
      tip(w ? '有 ' + w + ' 格塗錯了，紅色那幾格' : '目前塗的都是對的');
    });

    fresh();
  }

  function unmount() {
    stopClock();
    if (S && !S.counted && !S.done) {
      var filled = 0;
      for (var i = 0; i < S.user.length; i++) if (S.user[i]) filled++;
      if (filled) {
        App.report({ type: 'finish', game: 'nonogram', mistakes: S.mistakes, secs: Math.floor(S.elapsed / 1000), level: S.diff.key });
        S.counted = true;
      }
    }
    S = null; host = null; bar = null;
  }

  App.register({
    id: 'nonogram',
    name: '數織',
    tagline: '照數字塗格子，塗完出現一張圖',
    ready: true,
    mark:
      '<svg viewBox="0 0 52 52" fill="none" aria-hidden="true">' +
      '<rect x="15.5" y="15.5" width="35" height="35" rx="4" stroke="currentColor" stroke-width="2.5"/>' +
      '<path d="M27 16v35M38.5 16v35M16 27h35M16 38.5h35" stroke="currentColor" stroke-width="1.4" opacity=".4"/>' +
      '<rect x="16" y="16" width="11" height="11" fill="currentColor"/>' +
      '<rect x="38.5" y="27.5" width="11" height="11" fill="currentColor"/>' +
      '<rect x="27.5" y="39" width="11" height="11" fill="currentColor"/>' +
      '<text x="7" y="24" font-size="10" font-weight="700" font-family="monospace" fill="currentColor">3</text>' +
      '<text x="7" y="36" font-size="10" font-weight="700" font-family="monospace" fill="currentColor">1</text>' +
      '<text x="20" y="11" font-size="10" font-weight="700" font-family="monospace" fill="currentColor">2</text>' +
      '</svg>',
    help:
      '<div class="hstep"><span class="hnum">1</span><div class="hbody">' +
        '<b>數字＝要連續塗黑幾格</b>' +
        '<div class="hrow"><span class="hclue">3</span>' +
          '<span class="hc on"></span><span class="hc on"></span><span class="hc on"></span>' +
          '<span class="hc"></span><span class="hc"></span></div>' +
        '<div class="hrow"><span class="hclue">1 2</span>' +
          '<span class="hc on"></span><span class="hc"></span>' +
          '<span class="hc on"></span><span class="hc on"></span><span class="hc"></span></div>' +
        '<div class="hnote">兩段之間，至少要空一格</div>' +
      '</div></div>' +

      '<div class="hstep"><span class="hnum">2</span><div class="hbody">' +
        '<b>先塗「怎麼擺都是黑的」那幾格</b>' +
        '<div class="hrow"><span class="hclue">4</span>' +
          '<span class="hc on"></span><span class="hc on"></span><span class="hc on"></span><span class="hc on"></span><span class="hc"></span></div>' +
        '<div class="hrow"><span class="hclue">或</span>' +
          '<span class="hc"></span><span class="hc on"></span><span class="hc on"></span><span class="hc on"></span><span class="hc on"></span></div>' +
        '<div class="hrow"><span class="hclue">→</span>' +
          '<span class="hc"></span><span class="hc maybe"></span><span class="hc maybe"></span><span class="hc maybe"></span><span class="hc"></span></div>' +
        '<div class="hnote">五格裡要塞四格，不管往左往右擺，<u>中間這三格</u>一定是黑的 —— 先塗這種就對了</div>' +
      '</div></div>' +

      '<div class="hstep"><span class="hnum">3</span><div class="hbody">' +
        '<b>橫排直排互相夾，就會越來越明朗</b>' +
        '<div class="hnote">塗掉幾格之後，直排的數字又會告訴你新線索。來回夾幾次，整張圖就出來了。' +
        '<br><em>每一題都保證推得出來，不用猜。</em></div>' +
      '</div></div>' +

      '<div class="hstep"><span class="hnum">4</span><div class="hbody">' +
        '<b>確定是空的，就打叉做記號</b>' +
        '<div class="hrow">' +
          '<span class="hc on"></span><span class="hc x"></span><span class="hc"></span><span class="hc x"></span><span class="hc on"></span></div>' +
        '<div class="hnote">打叉只是給自己看的，不算答案，但很好用 —— 排除掉之後剩下的就清楚了</div>' +
      '</div></div>',

    score: function () {
      for (var i = DIFFS.length - 1; i >= 0; i--) {
        var b = App.store('nbest.' + DIFFS[i].key);
        if (b) return DIFFS[i].name + '最快 ' + fmt(b * 1000);
      }
      return '';
    },
    mount: mount,
    unmount: unmount
  });
})();


/* === games/hashi.js === */
/* ===========================================================
   數橋（Hashiwokakero）
   島上的數字 = 要接幾座橋；橋只走直橫、不能交叉、兩島之間最多兩座；
   最後所有島要連成一整塊。
   出題保證答案唯一。
   =========================================================== */
(function () {

  var DIFFS = [
    { key: 'a', name: '入門', W: 6, isles: 7,  base: 10 },
    { key: 'b', name: '簡單', W: 7, isles: 10, base: 16 },
    { key: 'c', name: '普通', W: 8, isles: 14, base: 24 },
    { key: 'd', name: '進階', W: 9, isles: 18, base: 34 },
    { key: 'e', name: '困難', W: 9, isles: 22, base: 46 }
  ];

  var S = null, host = null, bar = null, ticker = null;

  /* ================= 出題 ================= */

  var DIRS = [[0, 1], [1, 0], [0, -1], [-1, 0]];

  function rnd(n) { return Math.floor(Math.random() * n); }

  /* 隨機長出一張「島＋橋」的圖，本身就是一組合法答案 */
  function grow(W, target) {
    var cell = new Array(W * W).fill(0);   /* 0=空 1=島 2=被橋佔用 */
    var isles = [], links = {};

    function at(r, c) { return r * W + c; }
    function inb(r, c) { return r >= 0 && r < W && c >= 0 && c < W; }

    var r0 = rnd(W), c0 = rnd(W);
    cell[at(r0, c0)] = 1;
    isles.push({ r: r0, c: c0 });

    var guard = 0;
    while (isles.length < target && guard++ < 900) {
      var a = rnd(isles.length), A = isles[a];
      var d = DIRS[rnd(4)];
      var dist = 2 + rnd(3);                       /* 中間至少留一格給橋 */
      var nr = A.r + d[0] * dist, nc = A.c + d[1] * dist;
      if (!inb(nr, nc) || cell[at(nr, nc)] !== 0) continue;

      /* 路徑上不能有島、也不能有別的橋 */
      var clear = true, k;
      for (k = 1; k < dist; k++) {
        var pr = A.r + d[0] * k, pc = A.c + d[1] * k;
        if (cell[at(pr, pc)] !== 0) { clear = false; break; }
      }
      if (!clear) continue;

      /* 新島旁邊不要緊貼別的島，畫面才不會擠 */
      var tooClose = false;
      for (k = 0; k < 4; k++) {
        var ar = nr + DIRS[k][0], ac = nc + DIRS[k][1];
        if (inb(ar, ac) && cell[at(ar, ac)] === 1) tooClose = true;
      }
      if (tooClose) continue;

      var b = isles.length;
      isles.push({ r: nr, c: nc });
      cell[at(nr, nc)] = 1;
      for (k = 1; k < dist; k++) cell[at(A.r + d[0] * k, A.c + d[1] * k)] = 2;
      links[a + ',' + b] = 1 + (Math.random() < 0.4 ? 1 : 0);
    }

    /* 再補幾條橋，讓圖有環、推理才有味道 */
    for (var t = 0; t < target * 3; t++) {
      var i = rnd(isles.length), I = isles[i];
      var dd = DIRS[rnd(4)];
      for (var dist2 = 2; dist2 <= 5; dist2++) {
        var rr = I.r + dd[0] * dist2, cc = I.c + dd[1] * dist2;
        if (!inb(rr, cc)) break;
        if (cell[at(rr, cc)] === 2) break;          /* 被橋擋住 */
        if (cell[at(rr, cc)] !== 1) continue;

        var j = -1;
        for (k = 0; k < isles.length; k++) if (isles[k].r === rr && isles[k].c === cc) j = k;
        if (j < 0) break;

        var key = Math.min(i, j) + ',' + Math.max(i, j);
        var cur = links[key] || 0;
        if (cur >= 2) break;

        var ok = true;
        for (k = 1; k < dist2; k++) {
          if (cell[at(I.r + dd[0] * k, I.c + dd[1] * k)] === 1) { ok = false; break; }
          if (!cur && cell[at(I.r + dd[0] * k, I.c + dd[1] * k)] === 2) { ok = false; break; }
        }
        if (!ok) break;

        links[key] = cur + 1;
        if (!cur) for (k = 1; k < dist2; k++) cell[at(I.r + dd[0] * k, I.c + dd[1] * k)] = 2;
        break;
      }
    }

    if (isles.length < 4) return null;

    var deg = new Array(isles.length).fill(0);
    for (var kk in links) {
      var p = kk.split(',');
      deg[+p[0]] += links[kk];
      deg[+p[1]] += links[kk];
    }
    for (k = 0; k < deg.length; k++) if (deg[k] === 0 || deg[k] > 8) return null;

    return { W: W, isles: isles, deg: deg };
  }

  /* 每座島往四個方向看，最近的那座島就是可以連的對象 */
  function pairsOf(isles, W) {
    var byPos = {};
    for (var i = 0; i < isles.length; i++) byPos[isles[i].r * W + isles[i].c] = i;
    var out = [], seen = {};
    for (i = 0; i < isles.length; i++) {
      for (var d = 0; d < 4; d++) {
        var dr = DIRS[d][0], dc = DIRS[d][1];
        var r = isles[i].r + dr, c = isles[i].c + dc;
        while (r >= 0 && r < W && c >= 0 && c < W) {
          var j = byPos[r * W + c];
          if (j !== undefined) {
            var key = Math.min(i, j) + ',' + Math.max(i, j);
            if (!seen[key]) {
              seen[key] = 1;
              out.push({ a: Math.min(i, j), b: Math.max(i, j), key: key });
            }
            break;
          }
          r += dr; c += dc;
        }
      }
    }
    return out;
  }

  /* 兩條橋會不會交叉 */
  function crosses(p, q, isles) {
    var A = isles[p.a], B = isles[p.b], C = isles[q.a], D = isles[q.b];
    var pH = A.r === B.r, qH = C.r === D.r;
    if (pH === qH) return false;
    var h = pH ? { r: A.r, c1: Math.min(A.c, B.c), c2: Math.max(A.c, B.c) } : { r: C.r, c1: Math.min(C.c, D.c), c2: Math.max(C.c, D.c) };
    var v = pH ? { c: C.c, r1: Math.min(C.r, D.r), r2: Math.max(C.r, D.r) } : { c: A.c, r1: Math.min(A.r, B.r), r2: Math.max(A.r, B.r) };
    return v.c > h.c1 && v.c < h.c2 && h.r > v.r1 && h.r < v.r2;
  }

  function connected(n, counts, pairs) {
    var adj = [];
    for (var i = 0; i < n; i++) adj.push([]);
    for (i = 0; i < pairs.length; i++) {
      if (counts[i] > 0) { adj[pairs[i].a].push(pairs[i].b); adj[pairs[i].b].push(pairs[i].a); }
    }
    var seen = new Array(n).fill(false), stack = [0], c = 0;
    seen[0] = true;
    while (stack.length) {
      var v = stack.pop(); c++;
      for (i = 0; i < adj[v].length; i++) if (!seen[adj[v][i]]) { seen[adj[v][i]] = true; stack.push(adj[v][i]); }
    }
    return c === n;
  }

  /* 數這題有幾組解，最多數到 limit */
  function countSolutions(puz, limit) {
    var isles = puz.isles, deg = puz.deg, n = isles.length;
    var pairs = pairsOf(isles, puz.W);
    var m = pairs.length;

    /* 每座島連到哪幾條邊 */
    var inc = [];
    for (var i = 0; i < n; i++) inc.push([]);
    for (i = 0; i < m; i++) { inc[pairs[i].a].push(i); inc[pairs[i].b].push(i); }

    /* 先算好哪些邊互相交叉 */
    var cross = [];
    for (i = 0; i < m; i++) cross.push([]);
    for (i = 0; i < m; i++) {
      for (var j = i + 1; j < m; j++) {
        if (crosses(pairs[i], pairs[j], isles)) { cross[i].push(j); cross[j].push(i); }
      }
    }

    /* 邊的處理順序很關鍵：把同一座島的邊排在一起，
       島才會早早被「填滿」而剪掉大量分支。差別是「跑不完」和「1 毫秒」。 */
    var order = [], placed = new Array(m).fill(false), visited = new Array(n).fill(false);
    var queue = [0];
    visited[0] = true;
    while (order.length < m) {
      if (!queue.length) {
        for (var s = 0; s < n; s++) if (!visited[s]) { queue.push(s); visited[s] = true; break; }
        if (!queue.length) break;
      }
      var cur = queue.shift();
      for (var e = 0; e < inc[cur].length; e++) {
        var ei = inc[cur][e];
        if (placed[ei]) continue;
        placed[ei] = true;
        order.push(ei);
        var other = pairs[ei].a === cur ? pairs[ei].b : pairs[ei].a;
        if (!visited[other]) { visited[other] = true; queue.push(other); }
      }
    }
    for (i = 0; i < m; i++) if (!placed[i]) order.push(i);

    var counts = new Array(m).fill(-1);
    var used = new Array(n).fill(0);
    var left = new Array(n).fill(0);      /* 還沒決定的邊數 */
    for (i = 0; i < n; i++) left[i] = inc[i].length;
    var found = 0, nodes = 0, aborted = false;

    /* 只檢查剛剛動到的兩座島就夠了，不用每次掃全部 */
    function okAt(k) {
      if (used[k] > deg[k]) return false;
      if (used[k] + left[k] * 2 < deg[k]) return false;
      return true;
    }

    function go(pos) {
      if (nodes++ > 300000) { aborted = true; return true; }
      if (pos === m) {
        for (var k = 0; k < n; k++) if (used[k] !== deg[k]) return false;
        if (!connected(n, counts, pairs)) return false;
        found++;
        return found >= limit;
      }
      var idx = order[pos], A = pairs[idx].a, B = pairs[idx].b;
      left[A]--; left[B]--;
      for (var v = 0; v <= 2; v++) {
        if (v > 0) {
          var blocked = false;
          for (var q = 0; q < cross[idx].length; q++) {
            if (counts[cross[idx][q]] > 0) { blocked = true; break; }
          }
          if (blocked) continue;
        }
        counts[idx] = v;
        used[A] += v; used[B] += v;
        if (okAt(A) && okAt(B) && go(pos + 1)) {
          used[A] -= v; used[B] -= v; counts[idx] = -1; left[A]++; left[B]++;
          return true;
        }
        used[A] -= v; used[B] -= v;
        counts[idx] = -1;
      }
      left[A]++; left[B]++;
      return false;
    }

    go(0);
    return aborted ? 99 : found;   /* 算不完就當作「不能保證唯一」，換一題 */
  }

  function makePuzzle(d) {
    for (var attempt = 0; attempt < 120; attempt++) {
      var g = grow(d.W, d.isles);
      if (!g) continue;
      if (g.isles.length < Math.max(5, d.isles - 3)) continue;
      if (countSolutions(g, 2) === 1) return g;
    }
    return null;
  }

  /* ================= 畫面 ================= */

  function el(id) { return host.querySelector('#' + id); }
  function tip(t, good) {
    var e = el('hTip');
    if (!e) return;
    e.className = 'h-tip' + (good ? ' good' : '');
    e.textContent = t || '';
  }

  function fmt(ms) {
    var s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }

  function drawBar() {
    bar.innerHTML =
      '<button class="g-mode" id="hMode" aria-label="更改難度"><b>' + S.diff.name + '</b><span>' + S.isles.length + ' 島</span></button>' +
      '<span class="s-time" id="hTime">0:00</span>' +
      '<button class="iconbtn" id="hNew" style="margin-left:auto" aria-label="換一題">&#8635;</button>';
    bar.querySelector('#hMode').addEventListener('click', diffSheet);
    bar.querySelector('#hNew').addEventListener('click', askNew);
  }

  function degNow(i) {
    var t = 0;
    for (var k = 0; k < S.pairs.length; k++) {
      if (S.pairs[k].a === i || S.pairs[k].b === i) t += S.counts[k];
    }
    return t;
  }

  function drawBoard() {
    var W = S.W, b = el('hBoard');
    b.style.gridTemplateColumns = 'repeat(' + W + ', 1fr)';
    b.style.fontSize = 'clamp(13px, ' + (46 / W) + 'px, 22px)';

    var isleAt = {};
    for (var i = 0; i < S.isles.length; i++) isleAt[S.isles[i].r * W + S.isles[i].c] = i;

    /* 先把橋畫進格子裡。橋所在的格子記下屬於哪一組，點它就能拆 */
    var brs = {}, brPair = {};
    for (var k = 0; k < S.pairs.length; k++) {
      var n = S.counts[k];
      if (!n) continue;
      var A = S.isles[S.pairs[k].a], B = S.isles[S.pairs[k].b];
      if (A.r === B.r) {
        for (var c = Math.min(A.c, B.c) + 1; c < Math.max(A.c, B.c); c++) {
          brs[A.r * W + c] = n === 1 ? '<i class="h-br h1"></i>' : '<i class="h-br h2a"></i><i class="h-br h2b"></i>';
          brPair[A.r * W + c] = k;
        }
      } else {
        for (var r = Math.min(A.r, B.r) + 1; r < Math.max(A.r, B.r); r++) {
          brs[r * W + A.c] = n === 1 ? '<i class="h-br v1"></i>' : '<i class="h-br v2a"></i><i class="h-br v2b"></i>';
          brPair[r * W + A.c] = k;
        }
      }
    }

    var h = '';
    for (var p = 0; p < W * W; p++) {
      var inner = brs[p] || '';
      var idx = isleAt[p];
      if (idx !== undefined) {
        var want = S.deg[idx], got = degNow(idx);
        var cls = 'h-isle';
        if (idx === S.sel) cls += ' sel';
        else if (idx === S.aim) cls += ' aim';
        else if (got === want) cls += ' done';
        else if (got > want) cls += ' over';
        inner += '<button class="' + cls + '" data-i="' + idx + '" aria-label="島 ' + want + '">' + want + '</button>';
      }
      var cellCls = 'h-cell' + (brPair[p] !== undefined ? ' hasbr' : '');
      var attr = brPair[p] !== undefined ? ' data-br="' + brPair[p] + '"' : '';
      h += '<div class="' + cellCls + '"' + attr + '>' + inner + '</div>';
    }
    b.innerHTML = h;
  }

  function draw() { drawBar(); drawBoard(); }

  /* ================= 操作 ================= */

  function pairIndex(i, j) {
    var key = Math.min(i, j) + ',' + Math.max(i, j);
    for (var k = 0; k < S.pairs.length; k++) if (S.pairs[k].key === key) return k;
    return -1;
  }

  /* 蓋一座上去（最多兩座）。回傳有沒有成功 */
  function addBridge(k) {
    if (S.counts[k] >= 2) { tip('兩座島之間最多兩座橋'); return false; }
    if (S.counts[k] === 0) {
      for (var q = 0; q < S.cross[k].length; q++) {
        if (S.counts[S.cross[k][q]] > 0) { tip('這座橋會跟別的橋交叉，不能蓋'); return false; }
      }
    }
    S.counts[k]++;
    S.moves++;
    tip('');
    return true;
  }

  /* 拆一座 */
  function removeBridge(k) {
    if (S.counts[k] <= 0) return false;
    S.counts[k]--;
    S.moves++;
    tip('');
    return true;
  }

  function tapIsle(i) {
    if (S.done) return;
    if (S.sel < 0) { S.sel = i; tip(''); drawBoard(); return; }
    if (S.sel === i) { S.sel = -1; tip(''); drawBoard(); return; }

    var k = pairIndex(S.sel, i);
    if (k < 0) { S.sel = i; tip('這兩座島之間不能直接連 —— 要同一橫排或同一直排，中間不能隔著別的島'); drawBoard(); return; }

    /* 點到底了就從頭來，維持原本「點三下拆掉」的習慣 */
    if (S.counts[k] >= 2) { S.counts[k] = 0; S.moves++; tip(''); }
    else addBridge(k);

    drawBoard();
    checkWin();
  }

  function checkWin() {
    for (var i = 0; i < S.isles.length; i++) {
      if (degNow(i) !== S.deg[i]) return;
    }
    if (!connected(S.isles.length, S.counts, S.pairs)) {
      /* 這是最容易卡住的地方 —— 數字全對但分成兩塊，要講出來 */
      tip('數字都對了！但還有島沒跟大家連在一起，要全部連成一整塊才算完成');
      return;
    }
    S.done = true;
    S.sel = -1;
    stopClock();
    drawBoard();
    win();
  }

  function startClock() {
    stopClock();
    S.t0 = Date.now() - S.elapsed;
    ticker = setInterval(function () {
      if (!S || S.done) return;
      S.elapsed = Date.now() - S.t0;
      var e = el('hTime');
      if (e) e.textContent = fmt(S.elapsed);
    }, 500);
  }
  function stopClock() { if (ticker) { clearInterval(ticker); ticker = null; } }

  /* ================= 一局結束 ================= */

  function win() {
    var d = S.diff;
    var secs = Math.floor(S.elapsed / 1000);
    var bk = 'hbest.' + d.key;
    var old = parseInt(App.store(bk) || '0', 10);
    var isBest = !old || secs < old;
    if (isBest) App.store(bk, secs);

    var earned = d.base;
    App.addCoins(earned);

    var ev = { game: 'hashi', secs: secs, level: d.key, mistakes: 0 };
    var r1 = App.report(Object.assign({ type: 'finish' }, ev));
    var r2 = App.report(Object.assign({ type: 'win' }, ev));
    S.counted = true;

    var bonus = r1.earned + r2.earned;
    var doneTxt = r1.done.concat(r2.done);
    var idx = DIFFS.indexOf(d), next = DIFFS[idx + 1];

    App.openSheet(
      '<div class="h-win">' +
        '<div class="cap">全部連起來了！花了</div>' +
        '<div class="big">' + fmt(S.elapsed) + '</div>' +
        '<div class="steps">' + S.isles.length + ' 座島' +
          (isBest ? ' · 這個難度最快紀錄！' : (old ? ' · 最快 ' + fmt(old * 1000) : '')) + '</div>' +
        '<div class="earn"><span class="coin"></span>+' + earned + ' 腦力點</div>' +
        (bonus ? '<div class="earn bonus">挑戰完成：' + doneTxt.join('、') + '　<span class="coin"></span>+' + bonus + '</div>' : '') +
        '<button class="btn-main" data-act="again">再來一題</button>' +
        (next ? '<button class="btn-ghost" data-act="up">試試看「' + next.name + '」</button>' : '') +
      '</div>',
      function (b) {
        if (b.dataset.act === 'up') {
          var k = DIFFS.indexOf(S.diff);
          if (DIFFS[k + 1]) { S.diff = DIFFS[k + 1]; App.store('hdiff', S.diff.key); }
        }
        App.closeSheet();
      },
      function () { fresh(); }
    );
  }

  /* ================= 換題 / 難度 ================= */

  function fresh() {
    S.done = true;
    stopClock();
    el('hWrap').innerHTML = '<div class="h-loading">出題中…</div>';
    bar.innerHTML = '';
    setTimeout(function () {
      if (!S) return;
      var made = makePuzzle(S.diff);
      if (!made) {
        el('hWrap').innerHTML = '<div class="h-loading">出題失敗，按右上角再試一次</div>';
        drawBar();
        return;
      }
      S.W = made.W;
      S.isles = made.isles;
      S.deg = made.deg;
      S.pairs = pairsOf(S.isles, S.W);
      S.counts = new Array(S.pairs.length).fill(0);

      S.cross = [];
      for (var i = 0; i < S.pairs.length; i++) S.cross.push([]);
      for (i = 0; i < S.pairs.length; i++) {
        for (var j = i + 1; j < S.pairs.length; j++) {
          if (crosses(S.pairs[i], S.pairs[j], S.isles)) { S.cross[i].push(j); S.cross[j].push(i); }
        }
      }

      /* 每座島往四個方向各對應哪一組橋，撥的時候要用 */
      S.dirPair = [];
      for (i = 0; i < S.isles.length; i++) S.dirPair.push([-1, -1, -1, -1]);
      for (i = 0; i < S.pairs.length; i++) {
        var PA = S.isles[S.pairs[i].a], PB = S.isles[S.pairs[i].b];
        if (PA.r === PB.r) {
          if (PB.c > PA.c) { S.dirPair[S.pairs[i].a][0] = i; S.dirPair[S.pairs[i].b][2] = i; }
          else { S.dirPair[S.pairs[i].a][2] = i; S.dirPair[S.pairs[i].b][0] = i; }
        } else {
          if (PB.r > PA.r) { S.dirPair[S.pairs[i].a][1] = i; S.dirPair[S.pairs[i].b][3] = i; }
          else { S.dirPair[S.pairs[i].a][3] = i; S.dirPair[S.pairs[i].b][1] = i; }
        }
      }

      S.sel = -1;
      S.aim = -1;
      S.dragFrom = -1;
      S.dragPair = -1;
      S.dragEndAt = 0;
      S.moves = 0;
      S.elapsed = 0;
      S.counted = false;
      S.done = false;
      el('hWrap').innerHTML = '<div class="h-board" id="hBoard"></div>';
      draw();
      tip('');
      startClock();
    }, 30);
  }

  function askNew() {
    var any = false;
    for (var i = 0; i < S.counts.length; i++) if (S.counts[i]) any = true;
    if (!any || S.done) { fresh(); return; }
    App.openSheet(
      '<h2>換一題新的？<small>這題已經蓋了一些橋，換掉就沒了</small></h2>' +
      '<button class="btn-main" data-act="yes">好，換新的</button>' +
      '<button class="btn-ghost" data-act="no">繼續解</button>',
      function (b) { App.closeSheet(); if (b.dataset.act === 'yes') fresh(); }
    );
  }

  function diffSheet() {
    var h = '<h2>難度<small>每一題都保證只有一種連法</small></h2><div class="opts">';
    for (var i = 0; i < DIFFS.length; i++) {
      var d = DIFFS[i];
      var best = App.store('hbest.' + d.key);
      h += '<button class="opt ' + (d.key === S.diff.key ? 'on' : '') + '" data-hdiff="' + d.key + '">' +
             '<span class="nm">' + d.name + '</span>' +
             '<span class="tag">約 ' + d.isles + ' 島</span>' +
             '<span class="best">' + (best ? '最快 ' + fmt(best * 1000) : '') + '</span>' +
           '</button>';
    }
    h += '</div><button class="btn-main" data-act="ok">好</button>';

    App.openSheet(h, function (b) {
      if (b.dataset.hdiff) {
        for (var k = 0; k < DIFFS.length; k++) if (DIFFS[k].key === b.dataset.hdiff) S.diff = DIFFS[k];
        App.store('hdiff', S.diff.key);
        App.closeSheet();
        fresh();
        return;
      }
      App.closeSheet();
    });
  }

  /* ================= 掛載 ================= */

  function mount(bodyEl, barEl) {
    host = bodyEl; bar = barEl;

    host.innerHTML =
      '<div class="h-wrap" id="hWrap"><div class="h-board" id="hBoard"></div></div>' +
      '<div class="h-pad">' +
        '<div class="h-actions">' +
          '<button class="h-act" id="hUndoAll">全部拆掉</button>' +
          '<button class="h-act" id="hHint">卡住了？</button>' +
        '</div>' +
        '<div class="h-tip" id="hTip"></div>' +
      '</div>';

    var dk = App.store('hdiff'), d = DIFFS[0];
    for (var i = 0; i < DIFFS.length; i++) if (DIFFS[i].key === dk) d = DIFFS[i];

    S = { diff: d, W: d.W, isles: [], deg: [], pairs: [], counts: [], cross: [], dirPair: [],
          sel: -1, aim: -1, dragFrom: -1, dragPair: -1, dragEndAt: 0,
          moves: 0, elapsed: 0, t0: 0, counted: false, done: true };

    /* ---- 三種操作，習慣哪種用哪種 ----
       1. 從島往一個方向撥：直接蓋一座（不用點準對面那座島）
       2. 點橋：拆掉一座
       3. 點兩座島：跟原本一樣
       第 1 種是主力 —— 一個手勢就好，而且只要方向對，不必點中小圓圈。 */
    var wrap = el('hWrap');

    /* 注意：這裡刻意不用 setPointerCapture。
       一旦捕捉了指標，瀏覽器會把後續的 click 改派給捕捉的那個元素，
       於是「點島」的 click 目標變成整個外框、找不到島，變成點了沒反應。
       改成把 move/up 掛在 document 上，就沒有這個問題。 */
    wrap.addEventListener('pointerdown', function (e) {
      if (S.done) return;
      var b = e.target.closest('.h-isle');
      if (!b) return;
      S.dragFrom = parseInt(b.dataset.i, 10);
      S.dragX = e.clientX; S.dragY = e.clientY;
      S.dragPair = -1;
      S.dragged = false;
    });

    function onMove(e) {
      if (!S || S.done || S.dragFrom < 0) return;
      var dx = e.clientX - S.dragX, dy = e.clientY - S.dragY;
      if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
      S.dragged = true;
      var d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3);
      var k = S.dirPair[S.dragFrom][d];
      if (k === S.dragPair) return;
      S.dragPair = k;
      S.aim = k < 0 ? -1 : (S.pairs[k].a === S.dragFrom ? S.pairs[k].b : S.pairs[k].a);
      S.sel = S.dragFrom;
      drawBoard();
    }

    function onUp() {
      if (!S || S.dragFrom < 0) return;
      var did = S.dragged, k = S.dragPair;
      S.dragFrom = -1; S.dragPair = -1; S.aim = -1;
      if (!did) return;               /* 沒撥動就交給 click 當一般點擊 */
      /* 撥完瀏覽器通常還會補一個 click，要吃掉它。用時間判斷而不是旗標 ——
         有些瀏覽器拖曳後根本不發 click，旗標會留著把下一次正常點擊吃掉。 */
      S.dragEndAt = Date.now();
      if (k < 0) { S.sel = -1; tip('那個方向沒有可以連的島'); drawBoard(); return; }
      addBridge(k);
      S.sel = -1;
      drawBoard();
      checkWin();
    }

    function onCancel() {
      if (!S) return;
      S.dragFrom = -1; S.dragPair = -1; S.aim = -1; drawBoard();

    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onCancel);
    S.detach = function () {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onCancel);

      if (cell) {
        if (S.done) return;
        removeBridge(parseInt(cell.dataset.br, 10));
        S.sel = -1;
        drawBoard();
        return;
      }
      S.sel = -1; drawBoard();
    });

    el('hUndoAll').addEventListener('click', function () {

    /* 給新手的推一把：找出「一定要連滿」的島 */
    el('hHint').addEventListener('click', function () {
      if (S.done) return;
      for (var i = 0; i < S.isles.length; i++) {

        for (var k = 0; k < S.pairs.length; k++) if (S.pairs[k].a === i || S.pairs[k].b === i) links++;
        if (degNow(i) === S.deg[i]) continue;
        if (S.deg[i] === links * 2) {

          drawBoard();
          tip('看這座 ' + S.deg[i] + '：它只有 ' + links + ' 個方向可以連，每個方向都得蓋兩座橋才夠', true);

          tip('看這座 ' + S.deg[i] + '：它只有一個方向可以連，橋一定往那邊蓋', true);
          return;

      }
      tip('這題沒有一眼就看得出來的島了，試試看從數字大的島開始推');
    });

    fresh();
  }

  function unmount() {

    if (S && S.detach) S.detach();
    if (S && !S.counted && !S.done) {
      var any = false;
      for (var i = 0; i < S.counts.length; i++) if (S.counts[i]) any = true;
