<style>
/* === styles.css === */
/* ============ tokens ============ */
:root {
  --bg: #EEF0F3;
  --surface: #FFFFFF;
  --surface-2: #F7F8FA;
  --ink: #1A2130;
  --ink-soft: #5B6675;
  --ink-faint: #97A0AE;
  --line: #DCE0E7;
  --accent: #27406E;
  --on-accent: #FFFFFF;
  --accent-soft: #E3E8F2;
  --bull: #15734F;
  --bull-soft: #DCEFE6;
  --cow: #B26E0E;
  --cow-soft: #F6EBD6;
  --shadow: 0 1px 2px rgba(26,33,48,.06), 0 6px 18px rgba(26,33,48,.07);

  --sans: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Hiragino Sans", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10141B;
    --surface: #1A202A;
    --surface-2: #212936;
    --ink: #E9ECF2;
    --ink-soft: #9AA4B4;
    --ink-faint: #6B7686;
    --line: #2B3441;
    --accent: #8FAADF;
    --on-accent: #10141B;
    --accent-soft: #24303F;
    --bull: #46C48D;
    --bull-soft: #1B3A2E;
    --cow: #E3A93F;
    --cow-soft: #3A2F19;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
}

:root[data-theme="dark"] {
  --bg: #10141B;
  --surface: #1A202A;
  --surface-2: #212936;
  --ink: #E9ECF2;
  --ink-soft: #9AA4B4;
  --ink-faint: #6B7686;
  --line: #2B3441;
  --accent: #8FAADF;
  --on-accent: #10141B;
  --accent-soft: #24303F;
  --bull: #46C48D;
  --bull-soft: #1B3A2E;
  --cow: #E3A93F;
  --cow-soft: #3A2F19;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
}

:root[data-theme="light"] {
  --bg: #EEF0F3;
  --surface: #FFFFFF;
  --surface-2: #F7F8FA;
  --ink: #1A2130;
  --ink-soft: #5B6675;
  --ink-faint: #97A0AE;
  --line: #DCE0E7;
  --accent: #27406E;
  --on-accent: #FFFFFF;
  --accent-soft: #E3E8F2;
  --bull: #15734F;
  --bull-soft: #DCEFE6;
  --cow: #B26E0E;
  --cow-soft: #F6EBD6;
  --shadow: 0 1px 2px rgba(26,33,48,.06), 0 6px 18px rgba(26,33,48,.07);
}

/* ============ base ============ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { font-size: 17px; }
html[data-fs="2"] { font-size: 19.5px; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.5;
  overscroll-behavior: none;
}

button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 460px;
  margin: 0 auto;
}

/* ============ lobby ============ */
.lobby {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
}

.date {
  font-size: .8rem;
  color: var(--ink-soft);
  letter-spacing: .07em;
}
.hi {
  font-size: 1.65rem;
  font-weight: 700;
  letter-spacing: .02em;
  margin: 1px 0 16px;
}

.lobtop { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 22px; }

/* 腦力點：一顆有厚度的籌碼，不是星星也不是愛心 */
.coin {
  display: inline-block;
  width: 15px; height: 15px;
  border-radius: 50%;
  background: var(--cow);
  border: 2.5px solid var(--cow-soft);
  flex: 0 0 auto;
  vertical-align: -2px;
}

.purse {
  margin-left: auto;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 14px;
  border-radius: 999px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.purse b { font-size: 1.12rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.purse .shoplb {
  font-size: .76rem;
  color: var(--ink-soft);
  border-left: 1px solid var(--line);
  padding-left: 8px;
  margin-left: 2px;
}
.purse:active { background: var(--surface-2); }

.eyebrow {
  font-size: .78rem;
  letter-spacing: .14em;
  color: var(--ink-faint);
  margin-bottom: 10px;
}
.eyebrow.spaced { margin-top: 28px; }
.eyebrow .cnt { color: var(--ink-soft); letter-spacing: normal; font-variant-numeric: tabular-nums; }

/* ---- 今天的挑戰 ---- */
.quests {
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.quest {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 13px 14px;
  border-bottom: 1px solid var(--line);
}
.quest:last-child { border-bottom: none; }
.quest .tick {
  flex: 0 0 auto;
  width: 21px; height: 21px;
  border-radius: 6px;
  border: 2px solid var(--line);
}
.quest.ok .tick {
  background: var(--bull);
  border-color: var(--bull);
  position: relative;
}
.quest.ok .tick::after {
  content: "";
  position: absolute;
  left: 5.5px; top: 2px;
  width: 5px; height: 10px;
  border-right: 2.5px solid var(--surface);
  border-bottom: 2.5px solid var(--surface);
  transform: rotate(42deg);
}
.quest .qt { font-size: .92rem; }
.quest .qt i { font-style: normal; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.quest.ok .qt { color: var(--ink-faint); text-decoration: line-through; }
.quest .qc {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: .84rem;
  font-weight: 700;
  color: var(--cow);
  font-variant-numeric: tabular-nums;
}
.quest.ok .qc { opacity: .4; }

.cards { display: flex; flex-direction: column; gap: 11px; }

.card {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  background: var(--surface);
  border-radius: 18px;
  padding: 15px 16px;
  box-shadow: var(--shadow);
  transition: transform .08s;
}
.card:active { transform: scale(.985); }

.card .mark { flex: 0 0 auto; width: 52px; height: 52px; color: var(--accent); }
.card .txt { min-width: 0; display: flex; flex-direction: column; }
.card .nm { font-size: 1.1rem; font-weight: 700; letter-spacing: .02em; line-height: 1.3; }
.card .tg { font-size: .85rem; color: var(--ink-soft); margin-top: 2px; line-height: 1.35; }
.card .sc {
  font-size: .8rem;
  color: var(--bull);
  margin-top: 5px;
  font-variant-numeric: tabular-nums;
}
.card .go {
  margin-left: auto;
  flex: 0 0 auto;
  width: 9px; height: 9px;
  border-right: 2.5px solid var(--ink-faint);
  border-bottom: 2.5px solid var(--ink-faint);
  transform: rotate(-45deg);
}

.card.soon { box-shadow: none; background: transparent; border: 1.5px dashed var(--line); }
.card.soon .mark { color: var(--ink-faint); }
.card.soon .nm { color: var(--ink-soft); }
.card.soon .go { display: none; }
.card.soon .badge {
  margin-left: auto;
  flex: 0 0 auto;
  font-size: .75rem;
  color: var(--ink-soft);
  background: var(--surface-2);
  padding: 4px 10px;
  border-radius: 999px;
}

.prefs {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 26px;
  padding: 10px 6px 0;
  border-top: 1px solid var(--line);
}
.prefs .lb { font-size: .85rem; color: var(--ink-soft); }
.seg { margin-left: auto; display: flex; gap: 4px; background: var(--surface-2); border-radius: 11px; padding: 4px; }
.seg [data-setfs] {
  padding: 8px 16px;
  border-radius: 8px;
  font-size: .9rem;
  color: var(--ink-soft);
}
.seg [data-setfs].on { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--shadow); }

/* ============ game shell ============ */
.game { display: flex; flex-direction: column; height: 100%; min-height: 0; }

.gamebar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: max(10px, env(safe-area-inset-top)) 12px 10px;
}
.iconbtn {
  flex: 0 0 auto;
  width: 44px; height: 44px;
  border-radius: 999px;
  background: var(--surface);
  box-shadow: var(--shadow);
  display: grid; place-items: center;
  font-size: 1.15rem;
  color: var(--ink-soft);
}
.iconbtn:active { background: var(--surface-2); }
.barslot { display: flex; align-items: center; gap: 9px; flex: 1 1 auto; min-width: 0; }

.gamebody { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }

/* ============ sheet ============ */
.veil {
  position: fixed; inset: 0;
  background: rgba(12,16,22,.45);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  z-index: 20;
}
.veil.on { opacity: 1; pointer-events: auto; }

.sheet {
  width: 100%;
  max-width: 460px;
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  padding: 20px 16px max(20px, env(safe-area-inset-bottom));
  transform: translateY(14px);
  transition: transform .22s ease-out;
  max-height: 88dvh;
  overflow-y: auto;
}
.veil.on .sheet { transform: none; }

.sheet h2 { margin: 0 0 14px; font-size: 1.06rem; letter-spacing: .02em; }
.sheet h2 small { display: block; font-size: .84rem; font-weight: 400; color: var(--ink-soft); margin-top: 4px; }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 14px;
  border-radius: 13px;
  background: var(--surface-2);
  border: 2px solid transparent;
}
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt .nm { font-weight: 700; font-size: 1rem; }
.opt .tag { font-size: .76rem; color: var(--ink-soft); padding: 3px 8px; border-radius: 999px; background: var(--surface); }
.opt .best { margin-left: auto; font-size: .78rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.toggle {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  border-radius: 13px;
  background: var(--surface-2);
  text-align: left;
}
.toggle .lb { font-size: .92rem; }
.toggle .lb small { display: block; font-size: .78rem; color: var(--ink-soft); }
.sw {
  margin-left: auto;
  width: 50px; height: 30px;
  border-radius: 999px;
  background: var(--line);
  position: relative;
  flex: 0 0 auto;
  transition: background .18s;
}
.sw::after {
  content: "";
  position: absolute; top: 3px; left: 3px;
  width: 24px; height: 24px;
  border-radius: 999px;
  background: var(--surface);
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
  transition: transform .18s;
}
.toggle.on .sw { background: var(--bull); }
.toggle.on .sw::after { transform: translateX(20px); }

/* ---- 商店 ---- */
.purse-big {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: .95rem;
  color: var(--ink-soft);
  margin-bottom: 14px;
}
.purse-big b { font-size: 1.3rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.purse-big .coin { width: 17px; height: 17px; }

.shopmsg {
  background: var(--bull-soft);
  color: var(--bull);
  font-size: .88rem;
  font-weight: 700;
  padding: 10px 13px;
  border-radius: 11px;
  margin-bottom: 12px;
}

.shopitem {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border-radius: 13px;
  background: var(--surface-2);
}
.shopitem.got { opacity: .6; }
.shopitem .si-txt { min-width: 0; }
.shopitem .nm { font-weight: 700; font-size: 1rem; }
.shopitem .nm i { font-style: normal; font-size: .78rem; font-weight: 400; color: var(--bull); }
.shopitem .tg { font-size: .82rem; color: var(--ink-soft); margin-top: 2px; }
.si-buy {
  margin-left: auto;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 5px;
  height: 44px;
  padding: 0 16px;
  border-radius: 11px;
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.si-buy .coin { border-color: rgba(255,255,255,.35); }
.si-buy.poor { background: var(--line); color: var(--ink-faint); }
.si-buy.poor .coin { background: var(--ink-faint); border-color: transparent; }
.si-got { margin-left: auto; flex: 0 0 auto; font-size: .84rem; color: var(--bull); font-weight: 700; }

/* ---- 怎麼玩 ---- */
.help { display: flex; flex-direction: column; gap: 18px; margin-bottom: 4px; }
.hstep { display: flex; gap: 12px; align-items: flex-start; }
.hnum {
  flex: 0 0 auto;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--on-accent);
  display: grid; place-items: center;
  font-size: .85rem; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.hbody { min-width: 0; }
.hbody b { display: block; font-size: 1rem; line-height: 1.4; }
.hnote { font-size: .84rem; color: var(--ink-soft); margin-top: 4px; line-height: 1.5; }
.hnote em { font-style: normal; color: var(--bull); font-weight: 700; }
.hnote u { text-decoration: none; color: var(--cow); font-weight: 700; }

.hrow { display: flex; align-items: center; gap: 4px; margin-top: 9px; flex-wrap: wrap; }
.hclue {
  font-family: var(--mono); font-weight: 700;
  color: var(--ink-soft); font-size: .9rem;
  margin-right: 5px;
}
.hc {
  width: 25px; height: 25px;
  border: 1.5px solid var(--line);
  border-radius: 4px;
  background: var(--surface-2);
  flex: 0 0 auto;
  position: relative;
  display: grid; place-items: center;
  font-family: var(--mono); font-size: .82rem; font-weight: 700;
}
.hc.on { background: var(--accent); border-color: var(--accent); }
.hc.maybe { background: var(--cow-soft); border-color: var(--cow); }
.hc.x::before, .hc.x::after {
  content: ""; position: absolute; left: 22%; top: 47%;
  width: 56%; height: 2px; background: var(--ink-faint);
}
.hc.x::before { transform: rotate(45deg); }
.hc.x::after { transform: rotate(-45deg); }
.harrow { color: var(--ink-faint); margin: 0 3px; font-size: .95rem; }

.hstone { width: 25px; height: 25px; border-radius: 50%; flex: 0 0 auto; }
.hstone.b { background: var(--ink); }
.hstone.w { background: var(--surface); border: 2px solid var(--ink); }

.btn-main {
  width: 100%;
  height: 54px;
  margin-top: 14px;
  border-radius: 13px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 1rem;
  font-weight: 700;
}
.btn-ghost {
  width: 100%;
  height: 50px;
  margin-top: 8px;
  border-radius: 13px;
  background: var(--surface-2);
  font-size: .95rem;
  color: var(--ink-soft);
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}


/* === games/guess.css === */
/* ============ 猜數字 ============ */
.g-mode {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.g-mode b { font-size: 1rem; font-weight: 700; letter-spacing: .01em; }
.g-mode span { font-size: .78rem; color: var(--ink-soft); }
.g-mode::after {
  content: "";
  width: 7px; height: 7px;
  border-right: 2px solid var(--ink-faint);
  border-bottom: 2px solid var(--ink-faint);
  transform: translateY(-2px) rotate(45deg);
  margin-left: 2px;
}

.g-board {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 4px 14px 12px;
  -webkit-overflow-scrolling: touch;
}

.g-empty {
  text-align: center;
  color: var(--ink-soft);
  padding: 22px 18px;
  font-size: .92rem;
  line-height: 1.75;
}
.g-empty b { display: block; color: var(--ink); font-size: 1rem; margin-bottom: 6px; }
.g-empty i { font-style: normal; color: var(--bull); font-weight: 700; }
.g-empty u { text-decoration: none; color: var(--cow); font-weight: 700; }

.g-rows { display: flex; flex-direction: column; gap: 8px; }

.g-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border-radius: 14px;
  padding: 9px 12px;
  box-shadow: var(--shadow);
  animation: g-pop .22s ease-out;
}
@keyframes g-pop { from { opacity: 0; transform: translateY(-6px); } }

.g-row .no { font-size: 13px; color: var(--ink-faint); font-variant-numeric: tabular-nums; min-width: 20px; }
.g-row .digits {
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: .18em;
  font-variant-numeric: tabular-nums;
}
.g-row .marks { margin-left: auto; display: flex; gap: 6px; }

.g-mark {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 8px;
  font-variant-numeric: tabular-nums;
}
.g-mark.a { color: var(--bull); background: var(--bull-soft); }
.g-mark.b { color: var(--cow); background: var(--cow-soft); }
.g-mark.z { color: var(--ink-faint); background: var(--surface-2); }

.g-pad {
  flex: 0 0 auto;
  padding: 12px 12px max(12px, env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--line);
  border-radius: 20px 20px 0 0;
  box-shadow: 0 -8px 24px rgba(26,33,48,.06);
}

.g-slots { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
.g-slot {
  width: 46px; height: 54px;
  border-radius: 11px;
  background: var(--surface-2);
  border: 2px solid var(--line);
  display: grid; place-items: center;
  font-family: var(--mono);
  font-size: 28px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.g-slot.filled { border-color: var(--accent); color: var(--ink); background: var(--surface); }
.g-slot.next { border-color: var(--accent); border-style: dashed; }

.g-keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.g-key {
  height: 56px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 25px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  transition: transform .06s;
}
.g-key:active { transform: scale(.94); background: var(--accent-soft); }
.g-key.off { color: var(--ink-faint); opacity: .42; text-decoration: line-through; text-decoration-thickness: 2px; }
.g-key.used { color: var(--ink-faint); opacity: .5; }

.g-actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 7px; margin-top: 7px; }
.g-act {
  height: 56px;
  border-radius: 12px;
  font-size: 1.05rem;
  font-weight: 700;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink-soft);
}
.g-act:active { transform: scale(.97); }
.g-act.go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); letter-spacing: .08em; }
